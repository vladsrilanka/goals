<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Достигни свою цель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#f3f5f7; --panel:#ffffff; --panel2:#eaeef2; --line:#d7dee5;
    --ink:#1b2733; --ink2:#5a6b7b; --ink3:#8b9aa9;
    --accent:#1f7fb5; --accent-ink:#ffffff; --accent-soft:#e2f0f8;
    --gold:#c98f2e; --gold-soft:#f6ecd8;
    --ok:#2e8b57; --ok-soft:#e2f2e9; --warn:#b07a1f; --warn-soft:#f6eeda;
    --bad:#c04b3c; --bad-soft:#f7e5e2; --info:#2f6fd0; --info-soft:#e4ecfa;
    --shadow:0 1px 3px rgba(20,35,50,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181f; --panel:#1a222b; --panel2:#212b36; --line:#2d3947;
      --ink:#e6edf3; --ink2:#9db0c0; --ink3:#6b7d8e;
      --accent:#4aa3d4; --accent-ink:#0d1319; --accent-soft:#1c3547;
      --gold:#d9a94f; --gold-soft:#39301c;
      --ok:#57b880; --ok-soft:#1d3527; --warn:#d0a04a; --warn-soft:#37301d;
      --bad:#dd7061; --bad-soft:#3c2320; --info:#6d9ce8; --info-soft:#1f2c44;
      --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181f; --panel:#1a222b; --panel2:#212b36; --line:#2d3947;
    --ink:#e6edf3; --ink2:#9db0c0; --ink3:#6b7d8e;
    --accent:#4aa3d4; --accent-ink:#0d1319; --accent-soft:#1c3547;
    --gold:#d9a94f; --gold-soft:#39301c;
    --ok:#57b880; --ok-soft:#1d3527; --warn:#d0a04a; --warn-soft:#37301d;
    --bad:#dd7061; --bad-soft:#3c2320; --info:#6d9ce8; --info-soft:#1f2c44;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px; line-height:1.45}
  .wrap{max-width:1120px; margin:0 auto; padding:24px 20px 80px}
  h1,h2,h3{font-family:"Oswald","IBM Plex Sans",sans-serif; font-weight:600; letter-spacing:.02em; text-wrap:balance; margin:0}
  h1{font-size:29px; text-transform:uppercase}
  h2{font-size:16.5px; text-transform:uppercase; color:var(--ink2); letter-spacing:.06em}
  h3{font-size:15px}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .num{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
  nav.main{display:flex; gap:6px; margin:14px 0 18px; flex-wrap:wrap; position:sticky; top:0; z-index:30; background:var(--bg); padding:10px 0}
  a.tile{display:block; color:inherit; text-decoration:none}
  a.tile:hover{border-color:var(--accent); text-decoration:none}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
  nav.main a{padding:7px 16px; border-radius:99px; background:var(--panel); border:1px solid var(--line); color:var(--ink2); font-weight:500}
  nav.main a.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  nav.main a:hover{text-decoration:none}
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .sub{color:var(--ink2); margin:2px 0 0}
  .savechip{font-size:12.5px; padding:4px 12px; border-radius:99px; background:var(--panel2); color:var(--ink2); border:1px solid var(--line); white-space:nowrap}
  .savechip.dirty{background:var(--warn-soft); color:var(--warn)}
  .savechip.saving{background:var(--accent-soft); color:var(--accent)}
  .savechip.local{background:var(--gold-soft); color:var(--gold)}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px}
  .panel>h2{margin-bottom:12px}
  .phead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .phead h2{margin:0}

  .goalrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .goal-big{font-size:34px; font-weight:600}
  .goal-big small{font-size:16px; color:var(--ink2); font-weight:400}
  .bar{height:22px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); overflow:hidden; margin:10px 0 8px; position:relative}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:99px; min-width:6px; transition:width .4s; position:relative; z-index:1}
  .bar>i.fc{position:absolute; inset:0 auto 0 0; background:var(--accent); opacity:.22; min-width:0; z-index:0}
  .subgoals{display:grid; gap:8px; margin-top:12px}
  .subgoal{display:grid; grid-template-columns:170px 1fr 120px; gap:10px; align-items:center; font-size:13.5px}
  @media (max-width:640px){.subgoal{grid-template-columns:1fr; gap:4px}}
  .subgoal .bar{height:10px; margin:0}
  .subgoal.life .bar>i{background:var(--ok)}
  .subgoal.move .bar>i{background:var(--gold)}
  .goalmeta{display:flex; gap:22px; flex-wrap:wrap; color:var(--ink2); font-size:13.5px}
  .goalmeta b{color:var(--ink)}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px}
  .tile .lbl{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3)}
  .tile .val{font-size:23px; font-weight:600; margin:4px 0 2px}
  .tile .hint{font-size:12.5px; color:var(--ink2)}
  .tile .minibar{height:6px; border-radius:99px; background:var(--panel2); margin-top:8px; overflow:hidden}
  .tile .minibar i{display:block; height:100%; border-radius:99px; background:var(--accent)}
  .tile.good .minibar i{background:var(--ok)}
  .tile.bad .minibar i{background:var(--bad)}

  table{width:100%; border-collapse:collapse; font-size:14px}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
  td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .tscroll{overflow-x:auto}
  td.r,th.r{text-align:right}

  input,select,button,textarea{font:inherit; color:var(--ink)}
  input,select{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 9px}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  input.inline{background:transparent; border:1px solid transparent; padding:4px 6px; width:100%}
  input.inline:hover,input.inline:focus{background:var(--panel2); border-color:var(--line)}
  input.amt{width:92px; text-align:right}
  input.prob{width:58px; text-align:right}
  select.slim{padding:4px 6px; font-size:13px; max-width:210px}
  button{border:none; border-radius:8px; padding:7px 14px; cursor:pointer; background:var(--panel2); color:var(--ink)}
  button.primary{background:var(--accent); color:var(--accent-ink); font-weight:600}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--ink2)}
  button.x{background:transparent; color:var(--ink3); padding:2px 8px; font-size:16px; line-height:1}
  button.x:hover{color:var(--bad)}
  button.mv{background:transparent; color:var(--ink3); padding:2px 6px}
  button.mv:hover{color:var(--accent)}

  .pill{display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px; white-space:nowrap}
  .st-idea{background:var(--panel2); color:var(--ink2)}
  .st-talks{background:var(--accent-soft); color:var(--accent)}
  .st-invoiced{background:var(--warn-soft); color:var(--warn)}
  .st-paid{background:var(--ok-soft); color:var(--ok)}
  .st-lost{background:var(--bad-soft); color:var(--bad)}
  .st-active{background:var(--ok-soft); color:var(--ok)}
  .st-waiting{background:var(--warn-soft); color:var(--warn)}
  .st-paused{background:var(--bad-soft); color:var(--bad)}
  .st-done{background:var(--info-soft); color:var(--info)}

  .addrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
  .addrow input[name=title]{flex:1; min-width:150px}
  .addrow input[name=comment]{flex:1; min-width:140px}

  .projgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .proj{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); cursor:pointer}
  .proj:hover{border-color:var(--accent); border-left-color:var(--accent)}
  .proj.p3{border-left-color:var(--bad)}
  .proj.p2{border-left-color:var(--gold)}
  .proj .head{display:flex; justify-content:space-between; gap:8px; align-items:center}
  .proj .name{font-weight:600}
  .proj .row2{display:flex; gap:8px; margin:8px 0 6px; flex-wrap:wrap}
  .proj .next{font-size:13px; color:var(--ink2); margin-top:4px}
  .proj .inc{font-size:12.5px; color:var(--ink3); margin-top:6px}
  label.mini{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); display:block; margin-bottom:4px}
  .muted{color:var(--ink2)}
  .neg{color:var(--bad)} .pos{color:var(--ok)}
  .totline{font-weight:600}

  /* debts */
  .veil .v{filter:blur(6px); user-select:none}
  .debt{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; background:var(--panel2)}
  .debt .bar{height:12px; margin:8px 0 6px}
  .debt .bar>i{background:linear-gradient(90deg,var(--bad),var(--gold))}
  .debt .head{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
  .debt .pays{margin-top:8px; font-size:13.5px}
  .debt .pays .p{display:flex; gap:10px; align-items:center; padding:3px 0; border-bottom:1px dashed var(--line)}
  .debt .pays .p:last-child{border-bottom:none}
  .eyebtn{font-size:16px; padding:5px 12px}

  /* weeks */
  .weekgrid{display:flex; flex-wrap:wrap; gap:8px}
  .wk{width:74px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); padding:7px 8px; cursor:pointer; text-align:left}
  .wk .d{font-size:11px; color:var(--ink3)}
  .wk .n{font-size:13px; font-weight:600; margin-top:2px}
  .wk.l1{background:var(--ok-soft)} .wk.l2{background:color-mix(in srgb,var(--ok) 30%,var(--panel))}
  .wk.l3{background:color-mix(in srgb,var(--ok) 50%,var(--panel))} .wk.l4{background:color-mix(in srgb,var(--ok) 72%,var(--panel)); color:#fff}
  .wk.l4 .d{color:rgba(255,255,255,.75)}
  .wk.negw{background:var(--bad-soft)}
  .wk.future{opacity:.45}
  .wk.now{outline:2px solid var(--accent); outline-offset:1px}
  .wk.sel{outline:2px solid var(--gold); outline-offset:1px}
  .legend{display:flex; gap:14px; font-size:12.5px; color:var(--ink2); margin-top:12px; flex-wrap:wrap; align-items:center}
  .legend i{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line)}

  /* tasks: list / kanban / gantt */
  .viewtog{display:flex; gap:6px}
  .viewtog button.on{background:var(--accent); color:var(--accent-ink)}
  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media (max-width:760px){.kanban{grid-template-columns:1fr}}
  .kcol{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; min-height:90px}
  .kcol>h3{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); margin-bottom:10px}
  .kcol.dropover{outline:2px dashed var(--accent); outline-offset:-2px}
  .kcard{border:none; border-left:4px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px; cursor:grab; box-shadow:var(--shadow)}
  .kcard:active{cursor:grabbing}
  .kcard.dragging{opacity:.45}
  .kcard.p3{background:color-mix(in srgb,var(--bad) 22%,var(--panel)); border-left-color:var(--bad)}
  .kcard.p2{background:color-mix(in srgb,var(--warn) 26%,var(--panel)); border-left-color:var(--warn)}
  .kcard.p1{background:color-mix(in srgb,var(--info) 22%,var(--panel)); border-left-color:var(--info)}
  .kcard .ctl{display:flex; gap:4px; align-items:center; margin-top:6px; flex-wrap:wrap}
  .kcard .tag{font-size:11.5px; color:var(--ink2); margin-top:2px}
  .kcard input.inline{font-weight:500}
  .tdone{text-decoration:line-through; opacity:.55}
  /* gantt */
  .gantt{--gl:230px; overflow-x:auto}
  .gantt .gin{min-width:640px}
  .gaxis{position:relative; height:38px; margin-left:var(--gl)}
  .gaxis span{position:absolute; bottom:0; transform:rotate(-52deg); transform-origin:left bottom; font-size:10px; color:var(--ink3); white-space:nowrap}
  .grow2{display:grid; grid-template-columns:var(--gl) 1fr; align-items:center; border-top:1px solid var(--line); padding:5px 0}
  .grow2 .ttl{padding-right:10px; font-size:13.5px; min-width:0}
  .grow2 .ttl .tname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .grow2 .ttl .dts{display:flex; gap:4px; margin-top:3px}
  .grow2 .ttl .dts input{font-size:11px; padding:2px 4px; width:112px}
  .gtrackwrap{position:relative; height:24px}
  .ggrid{position:absolute; inset:0; pointer-events:none}
  .gline{position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
  .gline.month{background:var(--ink3); opacity:.6}
  .gtoday{position:absolute; top:0; bottom:0; width:2px; background:var(--accent)}
  .gbar2{position:absolute; top:4px; height:16px; border-radius:4px; min-width:6px; box-shadow:var(--shadow)}
  .gbar2.p3{background:var(--bad)} .gbar2.p2{background:var(--warn)} .gbar2.p1{background:var(--info)}
  .gbar2.done{opacity:.4}
  @media (max-width:760px){.gantt{--gl:150px}}
  .backlink{display:inline-block; margin-bottom:12px; color:var(--ink2)}
  .dirhead{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .dirhead input.dname{font-family:"Oswald",sans-serif; font-size:24px; font-weight:600; text-transform:uppercase; flex:1; min-width:220px}
  .mrow{display:flex; gap:8px; flex-wrap:wrap}
  .mcell{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:96px}
  .mcell .lbl{font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.06em}
  .mcell .v2{font-weight:600; margin-top:2px}
  footer{color:var(--ink3); font-size:12.5px; text-align:center; margin-top:30px}
  /* goal combo bar */
  .gbar-click{cursor:pointer}
  .gbar-click:hover{outline:2px solid var(--accent); outline-offset:1px}
  .gtick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink2); z-index:3; border-radius:2px}
  .expandhint{font-size:12px; color:var(--ink3); white-space:nowrap; user-select:none}
  .expandhint .chev{display:inline-block; transition:transform .2s}
  .expandhint.open .chev{transform:rotate(180deg)}
  .tt{position:relative; cursor:help; border-bottom:1px dotted var(--ink3)}
  .tt:hover::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 7px); left:0; background:var(--ink); color:var(--bg); padding:7px 11px; border-radius:8px; font-size:12px; line-height:1.4; width:230px; z-index:20; box-shadow:var(--shadow); font-weight:400; white-space:normal}
  .explore{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
  .explore .deals{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; margin-top:6px; color:var(--ink2)}
  .goalx2{border-top:1px solid var(--line); margin-top:16px; padding-top:14px}
  .bigadd{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:46px 20px; cursor:pointer; border:2px dashed var(--line); background:transparent}
  .bigadd:hover{border-color:var(--accent)}
  .bigadd .plus{font-size:58px; line-height:1; color:var(--accent); font-weight:300}
  .bigadd .t{font-size:17px; color:var(--ink2); margin-top:8px}
  /* landing */
  .hero{text-align:center; padding:64px 16px 40px}
  .hero h1{font-size:clamp(34px,6vw,58px); letter-spacing:.03em}
  .hero p{color:var(--ink2); font-size:17px; max-width:560px; margin:14px auto 26px}
  .hero .cta{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .hero button.big{font-size:17px; padding:13px 28px; border-radius:12px}
  .feat{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:26px}
  .feat .panel{margin:0}
  .feat h3{margin-bottom:6px; font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent)}
  .feat p{font-size:13.5px; color:var(--ink2); margin:0}
</style>

<script type="application/json" id="state">__STATE__</script>

<div class="wrap">
  <header class="top">
    <div id="hdr" style="flex:1;min-width:240px"></div>
    <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="authbox"></span>
      <button class="ghost" id="themeBtn" title="Тема: авто / светлая / тёмная" style="padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink2)">◐</button>
      <span class="savechip" id="savechip">Загрузка…</span>
    </span>
  </header>
  <nav class="main" id="nav"></nav>
  <main id="app"></main>
  <footer>Всё редактируемое сохраняется автоматически. Статусы: <span class="pill st-active">в работе</span> <span class="pill st-waiting">ожидание</span> <span class="pill st-paused">пауза</span> <span class="pill st-done">готово</span></footer>
</div>

const V1_PROJ_MAP = { raul:["yt","raul","Доктор Рауль"], asmr:["yt","asmr","АСМР Чееек"],
  cursed:["roblox","cursed","Clean the Cursed House"], ikea:["roblox","ikea","Escape Ikea"],
  solit:["html","solit","Солитёр"], kub:["html","kub","Кубария"] };
function migrate(s){
  if (!s) return null;
  if (s.v>=2){
    for (const k of ["directions","projects","tasks","income","goals","expensesFixed","expensesAdhoc","debts","adjustments"])
      if (!Array.isArray(s[k])) s[k]=[];
    if (s.goal && !Array.isArray(s.goal.subs)){
      if (!s.goal.title) s.goal.title="Курс на Уругвай";
      s.goal.subs=[
        { id:"s1", label:s.goal.sub1Label||"Жизнь до отъезда", amount:+s.goal.lifeNeed||10000 },
        { id:"s2", label:s.goal.sub2Label||"Переезд", amount:+s.goal.moveNeed||20000 }
      ];
    }
    if(!s.settings) s.settings={ rubRate:100 };
    s.projects.forEach(p=>{ if(!p.prio) p.prio=2; });
    return s;
  }
  const out = clone(DEFAULT_STATE);
  out.updated = s.updated||Date.now();
  if (s.goal){ out.goal.target=s.goal.target||30000; out.goal.deadline=s.goal.deadline||out.goal.deadline; out.goal.weeklyMin=s.goal.weeklyMin||700; out.goal.start=s.goal.start||out.goal.start; }
  // старые "проекты" v1: known ids уже разложены в дефолте; незнакомые становятся направлениями
  for (const p of (s.projects||[])){
    if (V1_PROJ_MAP[p.id]){
      const pr = out.projects.find(x=>x.id===p.id); if (pr) pr.status = p.status==="done"?"done":(p.status||pr.status);
    } else {
      const d = out.directions.find(x=>x.id===p.id);
      if (d){ d.prio=p.prio||d.prio; d.status=p.status||d.status; }
      else out.directions.push({ id:p.id, name:p.name||p.id, prio:p.prio||1, status:p.status||"active" });
    }
    if (p.next){
      const m = V1_PROJ_MAP[p.id];
      const dirId = m?m[0]:p.id, projId = m?m[1]:null;
      if (!out.tasks.some(t=>t.title===p.next)) out.tasks.push({ id:"m_"+p.id, dirId, projId, title:p.next, prio:p.prio||1, status:"todo" });
    }
  }
  if (Array.isArray(s.expenses) && s.expenses.length)
    out.expensesFixed = s.expenses.map(e=>({ id:e.id, title:e.title, amount:+e.amount||0 }));
  out.income = (s.income||[]).map(i=>{
    const m = V1_PROJ_MAP[i.project];
    return { id:i.id, date:i.date||"", title:i.title, dirId:m?m[0]:(i.project||""), projId:m?m[1]:null,
      amount:+i.amount||0, prob:+i.prob||0, status:i.status||"idea" };
  });
  out.v=2; return out;
}

function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

function rangeBounds(r){
  const now=new Date();
  if(r.mode==="week"){ const m=mondayOf(now); return [m,addD(m,7)]; }
  if(r.mode==="month") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,1)];
  if(r.mode==="q") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+3,1)];
  if(r.mode==="year") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear()+1,now.getMonth(),1)];
  if(r.mode==="custom"&&r.from&&r.to) return [new Date(r.from+"T00:00"), addD(new Date(r.to+"T00:00"),1)];
  return null;
}
function taskInRange(t,b){
  const s=t.start?new Date(t.start+"T12:00"):null, d=t.due?new Date(t.due+"T12:00"):null;

  box.querySelector("[data-exp-pot]").style.width=Math.min(100,pot/target*100)+"%";

  box.querySelector("[data-exp-amt]").textContent=fmt(pot);
  box.querySelector("[data-exp-deals]").innerHTML=deals.slice().sort((a,b)=>(b.prob||0)-(a.prob||0)).map(d=>
    '<span style="'+((d.prob||0)>=thr?'':'opacity:.35;text-decoration:line-through')+'">'+esc(d.title)+' <b class="num">'+fmt(amtOf(d))+'</b> · '+(d.prob||0)+'%</span>').join("");

/* ---------- pace & focus ---------- */
function paceStats(){
  let need=0;
  const add=(remain,deadline)=>{
    if(!deadline||remain<=0) return;
    const wl=Math.max(1,(new Date(deadline+"T23:59:59")-new Date())/6048e5);
    need+=remain/wl;
  };
  if(state.goal) add(goalTargetMain()-paidTotalGoal("main"), state.goal.deadline);
  for(const g of state.goals) add((+g.target||0)-paidTotalGoal(g.id), g.deadline);
  const now=new Date();
  const pace=state.income.filter(i=>i.status==="paid"&&inRange(i.date,addD(now,-28),addD(now,1)))
    .reduce((s,i)=>s+amtOf(i),0)/4;
  return { need, pace, wgt: weighted() };
}
function vPace(){
  const {need,pace,wgt}=paceStats();
  if(!need) return "";
  const cov=pace/need;
  const cls=cov>=1?"ok":cov>=0.6?"warn":"bad";
  const col=cls==="ok"?"var(--ok)":cls==="warn"?"var(--warn)":"var(--bad)";
  const msg=cls==="ok"
    ? "Темп держится — при таком заработке цели закроются к дедлайнам."
    : cls==="warn"
    ? "Темп проседает. Закрой сделки из пайплайна — они покрывают разрыв."
    : "Темпа не хватает. Смотри «Сфокусируйся» ниже: эти задачи двигают деньги.";
  return `<section class="panel" style="border-left:4px solid ${col}">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <span style="width:16px;height:16px;border-radius:99px;background:${col};flex:none"></span>
      <span>Чтобы закрыть все цели к дедлайнам: <b class="num">${fmt(need)}/нед</b></span>
      <span class="muted">·</span>
      <span>Твой темп (4 недели): <b class="num" style="color:${col}">${fmt(pace)}/нед</b></span>
      ${wgt?'<span class="muted">·</span><span>В пайплайне ждёт: <b class="num">'+fmt(wgt)+'</b></span>':''}
    </div>
    <p class="muted" style="margin:8px 0 0;font-size:13px">${msg}</p>
  </section>`;
}
function focusTasks(){
  const dirMoney={};
  for(const i of state.income)
    if(["idea","talks","invoiced"].includes(i.status)&&i.dirId)
      dirMoney[i.dirId]=(dirMoney[i.dirId]||0)+amtOf(i)*(i.prob||0)/100;
  const maxDM=Math.max(1,...Object.values(dirMoney),1);
  const dlScore=t=>{ if(!t.due) return 0; const d=(new Date(t.due+"T12:00")-new Date())/864e5; return d<0?3:d<7?2:d<30?1:0; };
  return state.tasks.filter(t=>t.status!=="done")
    .map(t=>({t, m:dirMoney[t.dirId]||0, s:(t.urgent?1000:0)+t.prio*100+((dirMoney[t.dirId]||0)/maxDM)*80+dlScore(t)*40}))
    .sort((a,b)=>b.s-a.s).slice(0,3);
}

  return `<section class="panel">

  return `
  ${vGoalArea()}

function vDebts(){

  let detail='<p class="muted">Нажми на неделю, чтобы увидеть сводку.</p>';

      ${(!incs.length&&!exps.length&&!pays.length)?'<p class="muted">Записей нет.</p>':''}`;
  }

  const adj=state.adjustments.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `

function vKanban(dirId){
  const ts=tasksSorted(dirId);
  return '<div class="kanban">'+TASK_COLS.map(([st,label],ci)=>{
    const items=ts.filter(t=>t.status===st);
    const cards=items.map(t=>`<div class="kcard p${t.prio}" draggable="true" data-id="${t.id}">
      <input class="inline ${st==="done"?"tdone":""}" data-f="title" value="${esc(t.title)}">
      ${taskTag(t,!dirId)?'<div class="tag">'+taskTag(t,!dirId)+'</div>':''}
      <div class="ctl">${fireBtn(t)}${sel("task-prio",String(t.prio),PRIO_OPTS)}

        ${ci<2?'<button class="mv" data-mv="1" title="Вперёд">▶</button>':''}
        <button class="x" data-del="tasks">×</button></div></div>`).join("");
    return '<div class="kcol" data-col="'+st+'"><h3>'+label+' · '+items.length+'</h3>'+(cards||'<p class="muted" style="font-size:13px">перетащи сюда</p>')+'</div>';
  }).join("")+'</div>';
}
function vGantt(dirId){
  const ts=tasksSorted(dirId);
  if(!ts.length) return '<p class="muted">Задач нет — добавь первую ниже.</p>';
  const dated=ts.filter(t=>t.start&&t.due);
  const gb=rangeBounds(getRange(dirId||"all"));
  let min,max;
  if(gb){ min=mondayOf(gb[0]); max=addD(mondayOf(addD(gb[1],6)),0); if(max<=min) max=addD(min,7); }
  else if(dated.length){
    min=mondayOf(new Date(Math.min(...dated.map(t=>+new Date(t.start+"T12:00")))));
    max=addD(mondayOf(new Date(Math.max(...dated.map(t=>+new Date(t.due+"T12:00"))))),7);
  } else { min=mondayOf(new Date()); max=addD(min,28); }
  if((max-min)/6048e5<4) max=addD(min,28);
  const total=max-min, px=d=>((d-min)/total*100);
  let lines="",labels="";
  for(let d=new Date(min); d<=max; d=addD(d,7)){
    const x=px(d), isM=d.getDate()<=7;
    lines+='<i class="gline'+(isM?" month":"")+'" style="left:'+x+'%"></i>';
    labels+='<span style="left:'+x+'%">'+fmtD(d)+'</span>';
  }
  const now=new Date();
  const today=(now>=min&&now<=max)?'<i class="gtoday" style="left:'+px(now)+'%"></i>':'';
  const rows=ts.map(t=>{
    let bar='';
    if(t.start&&t.due){
      const s=new Date(t.start+"T12:00"), e=addD(new Date(t.due+"T12:00"),1);
      const l=Math.max(0,Math.min(99,px(s))), w=Math.max(1.2,Math.min(px(e),100)-l);
      bar='<div class="gbar2 p'+t.prio+(t.status==="done"?" done":"")+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(t.title)+'"></div>';
    }
    return `<div class="grow2" data-id="${t.id}">
      <div class="ttl"><span class="tname ${t.status==="done"?"tdone":""}">${t.urgent?"🔥 ":""}${esc(t.title)}</span>
        <div class="dts"><input class="num" data-f="start" type="date" value="${t.start||""}"><input class="num" data-f="due" type="date" value="${t.due||""}"></div></div>
      <div class="gtrackwrap"><div class="ggrid">${lines}${today}</div>${bar}</div></div>`;
  }).join("");
  return '<div class="gantt"><div class="gin"><div class="gaxis">'+labels+'</div>'+rows+'</div></div>';
}

function listOf(name){ return state[name]; }
function findItem(id){
  for (const k of ["income","goals","expensesFixed","expensesAdhoc","directions","projects","tasks","debts","adjustments"]){
    const it=state[k].find(x=>x.id===id); if(it) return it;
  }
  if (state.goal && Array.isArray(state.goal.subs)){
    const it=state.goal.subs.find(x=>x.id===id); if(it) return it;
  }
  return null;
}

  if(t.classList.contains("goal-f")){
    state.goal[t.dataset.g] = t.type==="number" ? +t.value : t.value;
    touch(false); return;
  }
  if(!t.dataset.f) return;
  const holder=t.closest("[data-id]"); if(!holder) return;
  const item=findItem(holder.dataset.id); if(!item) return;

document.addEventListener("change", e=>{
  const t=e.target, holder=t.closest("[data-id]");
  const cl=t.classList;
  if(cl.contains("goal-f")){ touch(true); return; }
  if(cl.contains("inc-st")&&holder){
    const i=state.income.find(x=>x.id===holder.dataset.id);
    i.status=t.value;
    if(t.value==="paid"){ i.prob=100; if(!i.date) i.date=today(); }
    touch(true); return;
  }
  if(cl.contains("inc-target")&&holder){ applyTarget(state.income.find(x=>x.id===holder.dataset.id), t.value); touch(true); return; }
  if(cl.contains("inc-goal")&&holder){ state.income.find(x=>x.id===holder.dataset.id).goalId=t.value; touch(true); return; }
  if(cl.contains("inc-cur")&&holder){ state.income.find(x=>x.id===holder.dataset.id).cur=t.value; touch(true); return; }
  if(cl.contains("set-rate")){ state.settings.rubRate=Math.max(1,+t.value||100); touch(true); return; }
  if(cl.contains("task-range")){ const r=getRange(t.dataset.scope); r.mode=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("range-from")){ const r=getRange(t.dataset.scope); r.from=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("range-to")){ const r=getRange(t.dataset.scope); r.to=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("dir-prio")){ dir(t.dataset.dir).prio=+t.value; touch(true); return; }
  if(cl.contains("dir-st")){ dir(t.dataset.dir).status=t.value; touch(true); return; }
  if(cl.contains("proj-st")&&holder){ proj(holder.dataset.id).status=t.value; touch(true); return; }
  if(cl.contains("pj-prio")&&holder){ proj(holder.dataset.id).prio=+t.value; touch(true); return; }
  if(cl.contains("task-prio")&&holder){ state.tasks.find(x=>x.id===holder.dataset.id).prio=+t.value; touch(true); return; }
  if(cl.contains("task-st")&&holder){ state.tasks.find(x=>x.id===holder.dataset.id).status=t.value; touch(true); return; }
  if(t.dataset.f==="prob"&&holder){
    /* «получено» = факт на 100%. Поставил вероятность < 100 — запись возвращается в «счёт» и считается прогнозом */
    const inc=state.income.find(x=>x.id===holder.dataset.id);
    if(inc && inc.status==="paid" && +t.value<100) inc.status="invoiced";
    touch(true); return;
  }
  if(t.dataset.f){ touch(true); return; } // blur после inline-правки — перерисовать производные
});

document.addEventListener("submit", e=>{
  const f=e.target; e.preventDefault();
  const fd=new FormData(f);
  if(f.id==="incForm"){
    const st=fd.get("status")||"idea";
    const it={ id:uid(), title:fd.get("title"), amount:+fd.get("amount"), cur:fd.get("cur")||"USD", prob:st==="paid"?100:(+fd.get("prob")||0), status:st, date:fd.get("date")||(st==="paid"?today():""), dirId:"", projId:null, goalId:fd.get("goal")||"main" };
    applyTarget(it, fd.get("target"));
    state.income.push(it);
  }
  else if(f.id==="expForm") state.expensesFixed.push({ id:uid(), title:fd.get("title"), amount:+fd.get("amount") });
  else if(f.id==="adhocForm") state.expensesAdhoc.push({ id:uid(), date:fd.get("date")||today(), title:fd.get("title"), amount:+fd.get("amount"), comment:fd.get("comment")||"" });
  else if(f.id==="debtForm"){
    const type=fd.get("type"), amt=+fd.get("amount");
    state.debts.push(type==="bank"
      ? { id:uid(), title:fd.get("title"), type:"bank", monthly:amt, payments:[] }
      : { id:uid(), title:fd.get("title"), type:"lump", total:amt, due:fd.get("due")||"", payments:[] });
  }
  else if(f.id==="dirForm") state.directions.push({ id:uid(), name:fd.get("title"), prio:2, status:"active" });
  else if(f.id==="projForm") state.projects.push({ id:uid(), dirId:f.dataset.dir, name:fd.get("title"), status:"active", prio:2 });
  else if(f.classList.contains("taskForm")){
    let dirId=f.dataset.dir||"", projId=null;
    if(dirId) projId=fd.get("proj")||null;
    else { const tg=fd.get("target")||"";
      if(tg.startsWith("p:")){ const p=proj(tg.slice(2)); projId=p.id; dirId=p.dirId; }
      else if(tg.startsWith("d:")) dirId=tg.slice(2); }
    state.tasks.push({ id:uid(), dirId, projId, title:fd.get("title"), prio:+fd.get("prio"), status:"todo", start:fd.get("start")||"", due:fd.get("due")||"", urgent:false });
  }
  else if(f.id==="adjForm") state.adjustments.push({ id:uid(), date:fd.get("date")||today(), balance:+fd.get("balance"), comment:fd.get("comment")||"" });
  else if(f.id==="goalForm") state.goals.push({ id:uid(), name:fd.get("title"), target:+fd.get("amount"), deadline:fd.get("due")||"" });
  else if(f.id==="subForm"){ if(!state.goal.subs) state.goal.subs=[]; state.goal.subs.push({ id:uid(), label:fd.get("title"), amount:+fd.get("amount") }); }
  else if(f.classList.contains("payForm")){
    const debt=state.debts.find(x=>x.id===f.dataset.debt);
    debt.payments.push({ id:uid(), date:fd.get("date")||today(), amount:+fd.get("amount"), comment:fd.get("comment")||"" });
  }
  else return;
  f.reset&&f.reset();
  touch(true);
});

/* ================= saving ================= */
function chip(cls,text){ const c=document.getElementById("savechip"); c.className="savechip "+cls; c.textContent=text; }
function touch(rerender){
  state.updated=Date.now(); dirty=true;
  try{ localStorage.setItem(lsKey(), JSON.stringify(state)); }catch(e){}
  chip("dirty","Есть изменения…");
  if(rerender) render();
  clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave, 2500);
}
async function cloudSave(){
  if(!dirty) return;
  if(!artifactNS && authMode && session){
    chip("saving","Сохраняю…");
    try{ await accountPush(); dirty=false; chip("","✓ "+(session.user.email||"аккаунт")); }
    catch(e){ chip("local","Сохранено локально (нет сети?)"); dirty=false; }
    return;
  }
  if(!artifactNS && supaMode){
    chip("saving","Сохраняю…");
    try{ await supaPush(); dirty=false; chip("","В облаке ✓"); }
    catch(e){ chip("local","Сохранено локально (нет сети?)"); dirty=false; }
    return;
  }
  if(!artifactNS){ chip("local","Сохранено локально"); dirty=false; return; }
  chip("saving","Сохраняю…");
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  try{
    await artifactNS.publish({ "data/state.json": { content: json, contentType:"application/json" } });
    dirty=false; chip("","Сохранено ✓");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict"){ return; }
    if(code==="capability_disabled"||code==="read_only_path"){
      try{
        const src=await (await fetch("index.html")).text();
        const html=src.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,"$1"+json+"$2");
        await artifactNS.publish(html.startsWith("<!doctype")?html:"<!doctype html>\n"+html);
        dirty=false; return;
      }catch(e2){ chip("local","Сохранено локально"); dirty=false; return; }
    }
    if(code==="not_writer"||code==="not_granted"){ artifactNS=null; chip("local","Сохранено локально"); dirty=false; return; }
    chip("local","Сохранено локально"); dirty=false;
  }
}

/* ---------- Supabase sync (версия-сайт) ---------- */
function getSyncKey(){
  const m = location.search.match(/[?&]k=([A-Za-z0-9_-]{24,})/);
  if (m){ try{ localStorage.setItem("u30_key", m[1]); }catch(e){} return m[1]; }
  let k = null;
  try{ k = localStorage.getItem("u30_key"); }catch(e){}
  if (!k){
    const a = new Uint8Array(24); crypto.getRandomValues(a);
    k = Array.from(a, b=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"[b&63]).join("");
    try{ localStorage.setItem("u30_key", k); }catch(e){}
  }
  return k;
}
async function supaRpc(fn, body){
  const r = await fetch(SUPA.url+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "apikey":SUPA.key, "Authorization":"Bearer "+SUPA.key, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("supabase "+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function supaLoadMerge(){
  const remote = migrate(await supaRpc("goals_get", { p_k: supaKey }));
  if (remote && (remote.updated||0) > (state.updated||0)){ state = remote; render(); }
  else if (remote===null || (state.updated||0) > (remote?.updated||0)){ await supaPush(); }
}
async function supaPush(){
  await supaRpc("goals_set", { p_k: supaKey, p_data: state, p_updated: state.updated||0 });
}
function syncUrl(){ return location.origin + location.pathname + "?k=" + supaKey; }

/* ---------- Аккаунт (Supabase Auth: Google / почта) ---------- */
function loadSbLib(){
  return new Promise((res,rej)=>{
    if(window.supabase&&window.supabase.createClient) return res();
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("cdn"));
    document.head.appendChild(s);
  });
}
function blankState(){
  const s=clone(DEFAULT_STATE);
  ["directions","projects","tasks","income","goals","expensesFixed","expensesAdhoc","debts","adjustments"].forEach(k=>s[k]=[]);
  if(!s.settings) s.settings={ rubRate:100 };
  s.goal=null; /* у нового аккаунта цели нет — большой «+ Добавить цель» */
  s.updated=Date.now();
  return s;
}
const IS_SITE = !(window.claude && typeof window.claude.use==="function");
function lsKey(){ return (authMode&&session)?LS_KEY+"_"+session.user.id:LS_KEY; }
async function accountFetch(){
  const {data,error}=await sb.from("user_dashboards").select("data").eq("user_id",session.user.id).maybeSingle();
  if(error) throw error;
  return data?migrate(data.data):null;
}
async function accountPush(){
  const {error}=await sb.from("user_dashboards").upsert({ user_id:session.user.id, data:state, updated:state.updated||0, updated_at:new Date().toISOString() });
  if(error) throw error;
}
async function accountLoad(){
  /* данные аккаунта — только из строки аккаунта (+ его личный офлайн-кэш). Никаких переносов чужого. */
  const remote=await accountFetch();
  let cache=null;
  try{ cache=migrate(JSON.parse(localStorage.getItem(LS_KEY+"_"+session.user.id))); }catch(e){}
  state = newest(remote, cache) || blankState();
  render();
  await accountPush();
}
function renderAuth(){
  const el=document.getElementById("authbox");
  if(!el||!sb||artifactNS||!session){ if(el) el.innerHTML=""; return; }
  el.innerHTML = '<span class="muted" style="font-size:12.5px">'+esc(session.user.email||"аккаунт")+'</span> <button class="ghost" id="logoutBtn" style="padding:4px 10px;font-size:12.5px">Выйти</button>';
}
async function onAuthChanged(){
  renderAuth();
  if(session){
    chip("saving","Подключаю аккаунт…");
    try{ authMode=true; supaMode=false; await accountLoad(); chip("","✓ "+(session.user.email||"аккаунт")); }
    catch(e){ authMode=false; chip("local","Аккаунт: ошибка сети — обнови страницу"); }
  } else {
    /* вышел из аккаунта: чистим общий кэш и стартуем заново, чтобы данные аккаунта не остались на странице */
    authMode=false;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    location.reload();
  }
}
document.addEventListener("click", async e=>{
  if((e.target.id==="googleBtn"||e.target.id==="googleBtn2")&&sb){
    await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin+location.pathname } });
  }
  if(e.target.id==="emailBtn"&&sb){
    const email=prompt("Твоя почта — пришлём ссылку для входа:");
    if(!email) return;
    const {error}=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+location.pathname } });
    alert(error?("Не получилось: "+error.message):"Ссылка отправлена на "+email+". Открой письмо и перейди по ней.");
  }
  if(e.target.id==="logoutBtn"&&sb){ await sb.auth.signOut(); }
});

/* ================= theme ================= */
function applyTheme(){
  let t="auto"; try{ t=localStorage.getItem("u30_theme")||"auto"; }catch(e){}
  const r=document.documentElement;
  if(t==="auto") delete r.dataset.theme; else r.dataset.theme=t;
  const b=document.getElementById("themeBtn");
  if(b){ b.textContent = t==="light"?"☀️":t==="dark"?"🌙":"◐"; b.title="Тема: "+(t==="light"?"светлая":t==="dark"?"тёмная":"как в системе")+" (клик — переключить)"; }
}
applyTheme();

/* ================= boot ================= */
document.getElementById("savechip").addEventListener("click", async ()=>{
  if(!supaMode || artifactNS) return;
  try{ await navigator.clipboard.writeText(syncUrl()); chip("","Ссылка синхронизации скопирована"); }
  catch(e){ prompt("Ссылка для других устройств:", syncUrl()); }
  setTimeout(()=>chip("","В облаке ✓ · клик = ссылка"), 2500);
});
(async function(){
  if(!IS_SITE){
    /* артефакт: личная версия владельца; темой управляет оболочка Claude */
    const tb=document.getElementById("themeBtn"); if(tb) tb.style.display="none";
    await loadState();
    render();
    chip("local","Локально");
    const ns=await window.claude.use("artifact");
    if(ns){ artifactNS=ns; chip("","Синхронизация ✓"); if(dirty) cloudSave(); }
    else chip("local","Только локально (этот браузер)");
    return;
  }
  /* сайт: гость видит лендинг; дашборд и данные — только в аккаунте */
  state = blankState();
  render();
  if(!SUPA.key) return;
  try{
    await loadSbLib();
    sb = window.supabase.createClient(SUPA.url, SUPA.key);
    const r = await sb.auth.getSession();
    session = r.data.session;
    sb.auth.onAuthStateChange((_ev,s2)=>{
      const was=session&&session.user.id, now=s2&&s2.user.id;
      session=s2;
      if(was!==now) onAuthChanged();
    });
  }catch(e){ sb=null; }
  renderAuth();
  if(sb&&session) await onAuthChanged();
})();
</script>

</html>
