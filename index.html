<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЦЕЛЬ — трекер личных целей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#f1efec; --side:#faf9f7; --card:#ffffff; --card2:#f0eee9; --line:#e5e2dc;
    --ink:#20242b; --mut:#6d7178;
    --accent:#2288c0; --accent-hi:#3aa1d6; --accent-deep:#176a99; --accent-soft:rgba(34,136,192,.13);
    --notch:#20242b; --green:#2f9e5f; --yellow:#dfa523; --red:#d95445; --blue:#3a7bd5;
    --track:#e9e6e0;
    --shadow:0 1px 2px rgba(30,30,25,.05), 0 8px 22px rgba(30,30,25,.06);
    /* совместимость со старыми классами */
    --panel:var(--card); --panel2:var(--card2); --ink2:var(--mut); --ink3:var(--mut);
    --gold:var(--yellow); --ok:var(--green); --bad:var(--red); --warn:var(--yellow); --info:var(--blue);
    --accent-ink:#ffffff; --ok-soft:rgba(47,158,95,.15); --warn-soft:rgba(223,165,35,.18);
    --bad-soft:rgba(217,84,69,.15); --info-soft:rgba(58,123,213,.15); --gold-soft:rgba(223,165,35,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141518; --side:#191b1f; --card:#1e2025; --card2:#26292f; --line:#2e3138;
      --ink:#eceef1; --mut:#989ea8;
      --accent:#3d9ed4; --accent-hi:#5cb6e6; --accent-deep:#7ec4ea; --accent-soft:rgba(61,158,212,.18);
      --notch:#eceef1; --green:#3cad6e; --yellow:#e0ad34; --red:#e0665a; --blue:#5b8fe8;
      --track:#2b2e34;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.28);
      --accent-ink:#0d1319; --ok-soft:rgba(60,173,110,.18); --warn-soft:rgba(224,173,52,.2);
      --bad-soft:rgba(224,102,90,.18); --info-soft:rgba(91,143,232,.18); --gold-soft:rgba(224,173,52,.2);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141518; --side:#191b1f; --card:#1e2025; --card2:#26292f; --line:#2e3138;
    --ink:#eceef1; --mut:#989ea8;
    --accent:#3d9ed4; --accent-hi:#5cb6e6; --accent-deep:#7ec4ea; --accent-soft:rgba(61,158,212,.18);
    --notch:#eceef1; --green:#3cad6e; --yellow:#e0ad34; --red:#e0665a; --blue:#5b8fe8;
    --track:#2b2e34;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.28);
    --accent-ink:#0d1319; --ok-soft:rgba(60,173,110,.18); --warn-soft:rgba(224,173,52,.2);
    --bad-soft:rgba(224,102,90,.18); --info-soft:rgba(91,143,232,.18); --gold-soft:rgba(224,173,52,.2);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Golos Text",system-ui,sans-serif; font-size:14px; line-height:1.5;
    font-feature-settings:'tnum'; transition:background .25s, color .25s}
  h1,h2,h3{font-family:"Unbounded","Golos Text",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
  h1{font-size:26px; font-weight:600; line-height:1.15}
  h2{font-size:15px; font-weight:600}
  h3{font-size:14px; font-weight:600}
  a{color:var(--accent-deep); text-decoration:none}
  a:hover{text-decoration:underline}
  .num{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}
  .cap{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mut)}
  .muted{color:var(--mut)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  ::selection{background:var(--accent-soft)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

  /* ---------- shell ---------- */
  .shell{display:flex; min-height:100vh}
  .side{width:216px; flex:none; background:var(--side); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 12px; gap:4px; transition:width .2s;
    position:sticky; top:0; height:100vh; overflow-y:auto}
  .side.collapsed{width:58px; padding:18px 8px}
  .wordmark{font-family:"Unbounded",sans-serif; font-size:19px; font-weight:700; padding:0 8px 16px; display:flex; align-items:center; gap:2px}
  .wordmark i{color:var(--accent); font-style:normal}
  .side.collapsed .wordmark{justify-content:center; padding:0 0 16px}
  .side.collapsed .lbl-t, .side.collapsed .sideftr .txt{display:none}
  .navi{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--ink); cursor:pointer; font-size:14px}
  .navi:hover{background:var(--card2); text-decoration:none}
  .navi.on{background:var(--card2); color:var(--accent-deep); font-weight:600}
  .navi svg{flex:none; width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .side.collapsed .navi{justify-content:center; padding:9px 0}
  .sideftr{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line)}
  .prochip{background:var(--card2); border-radius:8px; padding:9px 10px; font-size:12px; color:var(--mut)}
  .prochip b{color:var(--ink); font-size:13px}
  .avatar{width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi)); color:#fff; font-weight:600; font-size:12px}
  .userrow{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--mut); min-width:0}
  .userrow .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sidebtn{background:transparent; border:1px solid var(--line); color:var(--mut); border-radius:8px; padding:6px 9px; cursor:pointer; font:inherit; font-size:12.5px}
  .sidebtn:hover{border-color:var(--accent); color:var(--accent-deep)}
  .main{flex:1; min-width:0; padding:22px 26px 40px; max-width:1360px}
  .phead2{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; flex-wrap:wrap}
  .phead2 h1{font-size:20px}
  .phead2 .sub{font-size:13px; color:var(--mut); margin-top:3px}
  .savechip{font-size:12px; padding:4px 11px; border-radius:99px; background:var(--card2); color:var(--mut); border:1px solid var(--line); white-space:nowrap}
  .savechip.dirty{background:var(--warn-soft); color:var(--yellow)}
  .savechip.saving{background:var(--accent-soft); color:var(--accent-deep)}
  .savechip.local{background:var(--card2); color:var(--mut)}

  /* ---------- cards & grid ---------- */
  .panel,.card{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:20px; margin-bottom:12px}
  .panel>h2{margin-bottom:12px}
  .grid2{display:grid; grid-template-columns:1fr 360px; gap:12px; align-items:start}
  .grid2b{display:grid; grid-template-columns:1fr 336px; gap:12px; align-items:start}
  @media(max-width:1100px){ .grid2,.grid2b{grid-template-columns:1fr} }
  .phead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
  .phead h2{margin:0}

  /* ---------- combo bar (signature) ---------- */
  .cbar{position:relative; height:28px; margin:14px 0 10px}
  .cbar .trk{position:absolute; inset:0; border-radius:6px; background:var(--track)}
  .cbar .exp{position:absolute; top:0; bottom:0; left:0; border-radius:6px; border:1px solid var(--accent-soft);
    background:repeating-linear-gradient(-55deg, var(--accent-soft) 0 8px, transparent 8px 16px)}
  .cbar .fct{position:absolute; top:0; bottom:0; left:0; border-radius:6px 0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-hi));
    clip-path:polygon(0 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 0 100%); transition:width .3s}
  .cbar .ntc{position:absolute; top:-5px; height:38px; width:2px; background:var(--notch); border-radius:1px}
  .cbar .ntc span{position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--mut); white-space:nowrap}
  .cbar.sm{height:14px; margin:8px 0 6px} .cbar.sm .ntc{top:-3px; height:20px}
  .cbar.sm .fct{clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%)}
  .cbar.xs{height:12px; margin:6px 0} .cbar.xs .ntc{top:-3px; height:18px} .cbar.xs .ntc span{display:none}
  .cbar.done .fct{background:linear-gradient(90deg,var(--green),var(--accent-hi)); clip-path:none; border-radius:6px}
  .cbar.lag .fct{background:linear-gradient(90deg,var(--yellow),var(--red))}
  .barlegend{display:flex; gap:16px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--mut)}
  .barlegend i{display:inline-block; width:13px; height:9px; border-radius:2px; vertical-align:-1px; margin-right:5px}
  .barlegend .l1 i{background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
  .barlegend .l2 i{background:repeating-linear-gradient(-55deg,var(--accent-soft) 0 4px,transparent 4px 8px); border:1px solid var(--accent-soft)}
  .barlegend .l3 i{width:2px; height:13px; background:var(--notch); border-radius:1px}
  .chip{border:1px solid var(--line); background:transparent; color:var(--accent-deep); border-radius:8px; padding:4px 11px; font:inherit; font-size:12.5px; cursor:pointer}
  .chip:hover{background:var(--accent-soft)}
  .probpanel{background:var(--card2); border-radius:8px; padding:12px 14px; margin-top:10px}

  /* ---------- ring ---------- */
  .ring{width:104px; height:104px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center}
  .ring>span{width:88px; height:88px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:44px}
  .ring.sm{width:56px;height:56px} .ring.sm>span{width:46px;height:46px;font-size:22px}

  /* ---------- traffic light ---------- */
  .tl{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
  .tl .dot{width:14px; height:14px; border-radius:50%; flex:none}
  .tl.ok .dot{background:var(--green); box-shadow:0 0 0 5px color-mix(in oklch, var(--green) 18%, transparent)}
  .tl.lag .dot{background:var(--yellow); box-shadow:0 0 0 5px color-mix(in oklch, var(--yellow) 18%, transparent)}
  .tl.fail .dot{background:var(--red); box-shadow:0 0 0 5px color-mix(in oklch, var(--red) 18%, transparent)}
  .tlmsg{font-size:13px; margin-top:8px}
  .tl.ok ~ .tlmsg{color:var(--green)} .tl.lag ~ .tlmsg{color:var(--yellow)} .tl.fail ~ .tlmsg{color:var(--red)}

  /* ---------- tiles ---------- */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:14px 16px; display:block; color:inherit}
  a.tile:hover{border-color:var(--accent); text-decoration:none}
  .tile .lbl{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mut)}
  .tile .val{font-size:21px; font-weight:700; margin:5px 0 2px; font-family:"JetBrains Mono",monospace}
  .tile .hint{font-size:12px; color:var(--mut)}
  .tile .minibar{height:6px; border-radius:2px; background:var(--track); margin-top:9px; overflow:hidden}
  .tile .minibar i{display:block; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
  .tile.good .minibar i{background:var(--green)} .tile.bad .minibar i{background:var(--red)}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); text-align:left; padding:0 8px 9px; border-bottom:1px solid var(--line); font-weight:500}
  td{padding:11px 8px; border-top:1px solid var(--line); vertical-align:middle}
  thead+tbody tr:first-child td{border-top:none}
  .tscroll{overflow-x:auto}
  td.r,th.r{text-align:right}

  /* ---------- controls ---------- */
  input,select,button,textarea{font:inherit; color:var(--ink)}
  input,select{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px}
  input:focus,select:focus{border-color:var(--accent)}
  input.inline{background:transparent; border:1px solid transparent; padding:5px 7px; width:100%}
  input.inline:hover,input.inline:focus{background:var(--card2); border-color:var(--line)}
  input.amt{width:96px; text-align:right} input.prob{width:60px; text-align:right}
  select.slim{padding:5px 7px; font-size:12.5px; max-width:210px}
  button{border:none; border-radius:8px; padding:8px 15px; cursor:pointer; background:var(--card2); color:var(--ink); font-size:13.5px}
  button.primary{background:var(--accent); color:#fff; font-weight:600}
  button.primary:hover{background:var(--accent-hi)}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--mut)}
  button.ghost:hover{border-color:var(--accent); color:var(--accent-deep)}
  button.x{background:transparent; color:var(--mut); padding:2px 8px; font-size:15px; line-height:1}
  button.x:hover{color:var(--red)}
  button.mv{background:transparent; color:var(--mut); padding:2px 6px}
  button.mv:hover{color:var(--accent)}
  .addrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
  .addrow input[name=title]{flex:1; min-width:150px}
  .addrow input[name=comment]{flex:1; min-width:140px}
  label.mini{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); display:block; margin-bottom:5px}

  /* ---------- pills / statuses ---------- */
  .pill{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:5px; white-space:nowrap}
  .st-idea{background:var(--card2); color:var(--mut)}
  .st-talks{background:var(--accent-soft); color:var(--accent-deep)}
  .st-invoiced{background:var(--warn-soft); color:var(--yellow)}
  .st-paid{background:var(--ok-soft); color:var(--green)}
  .st-lost{background:var(--bad-soft); color:var(--red)}
  .st-active{background:var(--ok-soft); color:var(--green)}
  .st-waiting{background:var(--warn-soft); color:var(--yellow)}
  .st-paused{background:var(--bad-soft); color:var(--red)}
  .st-done{background:var(--info-soft); color:var(--blue)}
  .pos{color:var(--green)} .neg{color:var(--red)}

  /* ---------- goal / subgoals ---------- */
  .goalrow{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .goal-big{font-size:38px; font-weight:700; font-family:"JetBrains Mono",monospace; color:var(--accent-deep); line-height:1.05}
  .goal-big small{font-size:15px; color:var(--mut); font-weight:500}
  .subgoals{display:grid; gap:10px; margin-top:16px}
  .subgoal{display:grid; grid-template-columns:1fr 150px; gap:6px 12px; align-items:center; font-size:13.5px}
  .subgoal .bar{grid-column:1/-1}
  .bar{height:6px; border-radius:2px; background:var(--track); overflow:hidden; position:relative}
  .bar>i{display:block; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent-hi))}
  .bar>i.done{background:var(--blue)}
  .goalmeta{display:flex; gap:20px; flex-wrap:wrap; color:var(--mut); font-size:12.5px; margin-top:10px}
  .goalmeta b{color:var(--ink)}
  .tt{position:relative; cursor:help; border-bottom:1px dotted var(--mut)}
  .tt:hover::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 7px); left:0; background:var(--ink); color:var(--card); padding:7px 11px; border-radius:8px; font-size:12px; line-height:1.4; width:230px; z-index:20; box-shadow:var(--shadow); font-weight:400; white-space:normal}
  .expandhint{font-size:12px; color:var(--mut); cursor:pointer; white-space:nowrap; user-select:none}
  .expandhint .chev{display:inline-block; transition:transform .2s}
  .expandhint.open .chev{transform:rotate(180deg)}
  .cbar.click{cursor:pointer}
  .cbar.click:hover .trk{outline:1px solid var(--accent); outline-offset:1px}
  .bigadd{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:46px 20px; cursor:pointer; border:1px dashed var(--line); background:transparent; box-shadow:none}
  .bigadd:hover{border-color:var(--accent)}
  .bigadd .plus{font-size:52px; line-height:1; color:var(--accent); font-weight:300}
  .bigadd .t{font-size:16px; color:var(--mut); margin-top:8px}

  /* ---------- focus / directions ---------- */
  .frow{display:flex; gap:11px; align-items:center; background:var(--card2); border-radius:8px; padding:11px 12px; margin-bottom:8px; flex-wrap:wrap}
  .frow:hover{background:var(--accent-soft)}
  .dirs{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
  .dircard{background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:14px 16px; cursor:pointer}
  .dircard:hover{border-color:var(--accent)}
  .dircard .nm{font-size:14px; font-weight:600; margin:8px 0 4px}
  .dircard .amt2{font-size:16px; font-weight:700; font-family:"JetBrains Mono",monospace; color:var(--accent-deep)}
  .dircard .note{font-size:12px; color:var(--mut); margin-top:3px}
  .sdot{width:9px; height:9px; border-radius:50%; display:inline-block}
  .sdot.active{background:var(--green)} .sdot.waiting{background:var(--yellow)}
  .sdot.paused{background:var(--red)} .sdot.done{background:var(--blue)}

  /* ---------- debts / weeks / kanban / gantt ---------- */
  .veil .v{filter:blur(6px); user-select:none}
  .debt{border:1px solid var(--line); border-radius:8px; padding:13px 14px; margin-bottom:10px; background:var(--card2)}
  .debt .head{display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap}
  .debt .pays{margin-top:8px; font-size:13px}
  .debt .pays .p{display:flex; gap:10px; align-items:center; padding:4px 0; border-top:1px solid var(--line)}
  .weekgrid{display:flex; flex-wrap:wrap; gap:8px}
  .wk{width:76px; border-radius:8px; border:1px solid var(--line); background:var(--card2); padding:8px; cursor:pointer; text-align:left; color:inherit}
  .wk .d{font-size:10.5px; color:var(--mut)} .wk .n{font-size:13px; font-weight:600; margin-top:2px; font-family:"JetBrains Mono",monospace}
  .wk.l1{background:color-mix(in srgb,var(--green) 12%,var(--card))} .wk.l2{background:color-mix(in srgb,var(--green) 26%,var(--card))}
  .wk.l3{background:color-mix(in srgb,var(--green) 45%,var(--card))} .wk.l4{background:color-mix(in srgb,var(--green) 68%,var(--card)); color:#fff}
  .wk.l4 .d{color:rgba(255,255,255,.8)}
  .wk.negw{background:color-mix(in srgb,var(--red) 15%,var(--card))}
  .wk.future{opacity:.45} .wk.now{outline:2px solid var(--accent); outline-offset:1px} .wk.sel{outline:2px solid var(--yellow); outline-offset:1px}
  .legend{display:flex; gap:14px; font-size:12px; color:var(--mut); margin-top:12px; flex-wrap:wrap; align-items:center}
  .legend i{display:inline-block; width:13px; height:13px; border-radius:3px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line)}
  .viewtog{display:flex; gap:6px}
  .viewtog button{background:var(--card2); color:var(--mut); padding:6px 12px; font-size:12.5px}
  .viewtog button.on{background:var(--accent); color:#fff; font-weight:600}
  .kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start}
  @media (max-width:760px){.kanban{grid-template-columns:1fr}}
  .kcol{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; min-height:90px}
  .kcol>h3{font-family:"Unbounded",sans-serif; font-size:13px; margin-bottom:12px; display:flex; align-items:center; gap:7px}
  .kcol.dropover{border-color:var(--accent); background:var(--accent-soft)}
  .kcard{background:var(--card2); border-radius:8px; padding:12px; margin-bottom:8px; cursor:grab}
  .kcard:hover{background:var(--accent-soft)}
  .kcard.dragging{opacity:.45}
  .kcard .ctl{display:flex; gap:5px; align-items:center; margin-top:7px; flex-wrap:wrap}
  .kcard .tag{font-size:11px; font-weight:600; background:var(--card); border-radius:5px; padding:2px 7px; color:var(--mut)}
  .kadd{width:100%; border:1px dashed var(--line); background:transparent; color:var(--mut); border-radius:8px; padding:9px; font-size:12.5px; cursor:pointer}
  .kadd:hover{border-color:var(--accent); color:var(--accent-deep)}
  .tdone{text-decoration:line-through; opacity:.55}
  tr.trow{cursor:grab} tr.trow:active{cursor:grabbing}
  tr.trow:hover{background:var(--accent-soft)}

/* ---------- migration v1 -> v2 ---------- */
const V1_PROJ_MAP = { raul:["yt","raul","Доктор Рауль"], asmr:["yt","asmr","АСМР Чееек"],
  cursed:["roblox","cursed","Clean the Cursed House"], ikea:["roblox","ikea","Escape Ikea"],
  solit:["html","solit","Солитёр"], kub:["html","kub","Кубария"] };
function migrate(s){
  if (!s) return null;
  if (s.v>=2){
    for (const k of ["directions","projects","tasks","income","goals","expensesFixed","expensesAdhoc","debts","adjustments"])
      if (!Array.isArray(s[k])) s[k]=[];
    if (s.goal && !Array.isArray(s.goal.subs)){
      if (!s.goal.title) s.goal.title="Курс на Уругвай";
      s.goal.subs=[
        { id:"s1", label:s.goal.sub1Label||"Жизнь до отъезда", amount:+s.goal.lifeNeed||10000 },
        { id:"s2", label:s.goal.sub2Label||"Переезд", amount:+s.goal.moveNeed||20000 }
      ];
    }
    if(!s.settings) s.settings={ rubRate:100 };
    s.projects.forEach(p=>{ if(!p.prio) p.prio=2; });
    s.tasks.forEach(function(t,i){ if(typeof t.ord!=="number") t.ord=i+1; if(typeof t.money!=="number") t.money=0; });
    return s;
  }
  const out = clone(DEFAULT_STATE);
  out.updated = s.updated||Date.now();
  if (s.goal){ out.goal.target=s.goal.target||30000; out.goal.deadline=s.goal.deadline||out.goal.deadline; out.goal.weeklyMin=s.goal.weeklyMin||700; out.goal.start=s.goal.start||out.goal.start; }
  // старые "проекты" v1: known ids уже разложены в дефолте; незнакомые становятся направлениями
  for (const p of (s.projects||[])){
    if (V1_PROJ_MAP[p.id]){
      const pr = out.projects.find(x=>x.id===p.id); if (pr) pr.status = p.status==="done"?"done":(p.status||pr.status);
    } else {
      const d = out.directions.find(x=>x.id===p.id);
      if (d){ d.prio=p.prio||d.prio; d.status=p.status||d.status; }
      else out.directions.push({ id:p.id, name:p.name||p.id, prio:p.prio||1, status:p.status||"active" });
    }
    if (p.next){
      const m = V1_PROJ_MAP[p.id];
      const dirId = m?m[0]:p.id, projId = m?m[1]:null;
      if (!out.tasks.some(t=>t.title===p.next)) out.tasks.push({ id:"m_"+p.id, dirId, projId, title:p.next, prio:p.prio||1, status:"todo" });
    }
  }
  if (Array.isArray(s.expenses) && s.expenses.length)
    out.expensesFixed = s.expenses.map(e=>({ id:e.id, title:e.title, amount:+e.amount||0 }));
  out.income = (s.income||[]).map(i=>{
    const m = V1_PROJ_MAP[i.project];
    return { id:i.id, date:i.date||"", title:i.title, dirId:m?m[0]:(i.project||""), projId:m?m[1]:null,
      amount:+i.amount||0, prob:+i.prob||0, status:i.status||"idea" };
  });
  out.v=2; return out;
}
function parseInline(){

/* ---------- lookups & math ---------- */
function dir(id){ return state.directions.find(d=>d.id===id); }
function proj(id){ return state.projects.find(p=>p.id===id); }
function incLabel(i){
  const d=dir(i.dirId), p=i.projId?proj(i.projId):null;
  return p ? (d?d.name+" / ":"")+p.name : (d?d.name:"—");
}
function mondayOf(x){ const d=new Date(x); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); d.setHours(0,0,0,0); return d; }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtD(d){ return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0"); }
function inRange(iso,a,b){ if(!iso) return false; const d=new Date(iso+"T12:00"); return d>=a && d<b; }
function paidIn(a,b,dirId){
  return state.income.filter(i=>i.status==="paid" && inRange(i.date,a,b) && (!dirId || i.dirId===dirId))
    .reduce((s,i)=>s+amtOf(i),0);
}
function adhocIn(a,b){ return state.expensesAdhoc.filter(e=>inRange(e.date,a,b)).reduce((s,e)=>s+ +e.amount,0); }
function debtPayIn(a,b){
  let s=0; for(const d of state.debts) for(const p of (d.payments||[])) if(inRange(p.date,a,b)) s+=+p.amount;
  return s;
}
function paidTotal(dirId){ return state.income.filter(i=>i.status==="paid" && (!dirId||i.dirId===dirId)).reduce((s,i)=>s+amtOf(i),0); }
function weighted(dirId){
  return state.income.filter(i=>["idea","talks","invoiced"].includes(i.status) && (!dirId||i.dirId===dirId))
    .reduce((s,i)=>s+amtOf(i)*(i.prob||0)/100,0);
}
function daysLeft(){ if(!state.goal||!state.goal.deadline) return 0; return Math.max(0,Math.ceil((new Date(state.goal.deadline+"T23:59:59")-new Date())/864e5)); }
function goalTargetMain(){ const g=state.goal; if(!g) return 0; const s=(g.subs||[]).reduce((a,x)=>a+ +x.amount,0); return s||+g.target||0; }
function openDeals(gid){ return state.income.filter(i=>["idea","talks","invoiced"].includes(i.status)&&goalIdOf(i)===gid); }
function maxPotential(gid){ return openDeals(gid).reduce((s,i)=>s+amtOf(i),0); }
/* денежные цели: main = Уругвай, остальные в state.goals */
function goalIdOf(i){ return i.goalId||"main"; }
function rubRate(){ return Math.max(1,(state.settings&&+state.settings.rubRate)||100); }
function amtOf(i){ return i.cur==="RUB" ? (+i.amount||0)/rubRate() : (+i.amount||0); }
function paidTotalGoal(gid){ return state.income.filter(i=>i.status==="paid"&&goalIdOf(i)===gid).reduce((s,i)=>s+amtOf(i),0); }
function weightedGoal(gid){
  return state.income.filter(i=>["idea","talks","invoiced"].includes(i.status)&&goalIdOf(i)===gid)
    .reduce((s,i)=>s+amtOf(i)*(i.prob||0)/100,0);
}
function goalName(gid){ if(gid==="main") return "Уругвай"; const g=state.goals.find(g=>g.id===gid); return g?g.name:"—"; }
/* фильтр задач по времени (per-scope) */
function getRange(scope){
  if(!taskRange[scope]){
    try{ taskRange[scope]=JSON.parse(localStorage.getItem("u30_range_"+scope))||{mode:"all"}; }
    catch(e){ taskRange[scope]={mode:"all"}; }
  }
  return taskRange[scope];
}
function saveRange(scope){ try{ localStorage.setItem("u30_range_"+scope, JSON.stringify(taskRange[scope])); }catch(e){} }
function rangeBounds(r){
  const now=new Date();
  if(r.mode==="week"){ const m=mondayOf(now); return [m,addD(m,7)]; }
  if(r.mode==="month") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+1,1)];
  if(r.mode==="q") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear(),now.getMonth()+3,1)];
  if(r.mode==="year") return [new Date(now.getFullYear(),now.getMonth(),1), new Date(now.getFullYear()+1,now.getMonth(),1)];
  if(r.mode==="custom"&&r.from&&r.to) return [new Date(r.from+"T00:00"), addD(new Date(r.to+"T00:00"),1)];
  return null;
}
function taskInRange(t,b){
  const s=t.start?new Date(t.start+"T12:00"):null, d=t.due?new Date(t.due+"T12:00"):null;
  if(!s&&!d) return false;
  return (s||d)<b[1] && (d||s)>=b[0];
}
function fixedMonthly(){
  const f = state.expensesFixed.reduce((s,e)=>s+ +e.amount,0);
  const b = state.debts.filter(d=>d.type==="bank").reduce((s,d)=>s+ +(d.monthly||0),0);
  return f+b;
}
function curWeek(){ const m=mondayOf(new Date()); return [m,addD(m,7)]; }
function curMonth(){ const a=new Date(); a.setDate(1); a.setHours(0,0,0,0); const b=new Date(a); b.setMonth(b.getMonth()+1); return [a,b]; }
function allWeeks(){
  if(!state.goal||!state.goal.start||!state.goal.deadline) return [];
  const out=[]; let m=mondayOf(new Date(state.goal.start+"T12:00"));
  const end=new Date(state.goal.deadline+"T23:59:59");
  while(m<=end){ out.push(new Date(m)); m=addD(m,7); }
  return out;
}

function sel(cls,cur,list,extra){

}

  return sel(cls,String(cur),[["3","приоритет: высокий"],["2","приоритет: средний"],["1","приоритет: низкий"]]);
}
function targetSel(cls,dirId,projId){
  let o='';
  for(const d of state.directions){
    o+='<option value="d:'+d.id+'"'+((dirId===d.id&&!projId)?" selected":"")+'>'+esc(d.name)+'</option>';
    for(const p of state.projects.filter(p=>p.dirId===d.id))
      o+='<option value="p:'+p.id+'"'+(projId===p.id?" selected":"")+'>&nbsp;&nbsp;— '+esc(p.name)+'</option>';

  return '<select class="slim '+cls+'">'+o+'</select>';
}

function route(){
  const h=location.hash;
  if (h.startsWith("#/dir/")) return {p:"dir", id:h.slice(6)};
  if (h.startsWith("#/weeks")) return {p:"weeks"};
  if (h.startsWith("#/money")) return {p:"money"};
  if (h.startsWith("#/tasks")) return {p:"tasks"};
  if (h.startsWith("#/g/")) return {p:"goal", id:h.slice(4)};
  if (h.startsWith("#/goal")) return {p:"goaledit"};
  return {p:"main"};
}

const NAVITEMS=[["main","#/","Главная"],["money","#/money","Деньги"],["tasks","#/tasks","Задачи"],["weeks","#/weeks","Недели"],["settings","#/goal","Настройки"]];
function navKey(r){ return (r.p==="goal"||r.p==="dir")?"main":(r.p==="goaledit"?"settings":r.p); }
const MONTHS_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DAYS_R=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
function greeting(){ const h=new Date().getHours(); return h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"; }
function userName(){
  const e=session&&session.user&&session.user.email;
  if(!e) return "";
  const n=e.split("@")[0].replace(/[._-]+/g," ").trim();
  return n.charAt(0).toUpperCase()+n.slice(1);
}
function pageTitle(r){
  const now=new Date();
  if(r.p==="money"){
    const [ma,mb]=curMonth();
    const free=paidIn(ma,mb)-fixedMonthly()-adhocIn(ma,mb)-debtPayIn(ma,mb);
    return ["Деньги", MONTHS_R[now.getMonth()]+" "+now.getFullYear()+" · доход "+fmt(paidIn(ma,mb))+" · свободно на цели "+fmt(free)];
  }
  if(r.p==="tasks"){
    const act=state.tasks.filter(t=>t.status!=="done").length;
    const fire=state.tasks.filter(t=>t.urgent&&t.status!=="done").length;
    return ["Задачи", act+" активных"+(fire?" · "+fire+" горящих":"")];
  }
  if(r.p==="weeks") return ["Недели", "история по неделям"+(state.goal&&state.goal.weeklyMin?" · норма "+fmt(state.goal.weeklyMin)+"/нед":"")];
  if(r.p==="goaledit") return ["Настройки", "цель, подцели, валюта, тема и аккаунт"];
  if(r.p==="dir"){ const d=dir(r.id)||{}; return [d.name||"Направление", "проекты, доход и задачи направления"]; }
  if(r.p==="goal"){
    const isMain=r.id==="main", g=isMain?state.goal:state.goals.find(x=>x.id===r.id);
    if(!g) return ["Цель",""];
    const paid=paidTotalGoal(r.id), tgt=isMain?goalTargetMain():+g.target||0;
    return [(g.emoji?g.emoji+" ":"")+(isMain?(g.title||"Моя цель"):g.name), fmt(paid)+" из "+fmt(tgt)+(g.deadline?" · до "+g.deadline:"")];
  }
  const nm=userName();
  const sub=DAYS_R[now.getDay()]+", "+now.getDate()+" "+MONTHS_GEN[now.getMonth()]+
    (state.goal&&state.goal.deadline?" · до дедлайна "+Math.ceil(daysLeft()/7)+" нед":"");
  return [greeting()+(nm?", "+nm:""), sub];
}
function renderHeader(r){
  const el=document.getElementById("hdr"); if(!el) return;
  const sc=document.getElementById("savechip");
  if(IS_SITE && !session){ el.innerHTML=""; if(sc) sc.style.display="none"; return; }
  if(sc) sc.style.display="";
  const t=pageTitle(r||route());
  el.innerHTML='<h1>'+esc(t[0])+'</h1>'+(t[1]?'<p class="sub">'+esc(t[1])+'</p>':'');
}
function renderSidebar(r){
  const nav=document.getElementById("nav"), ftr=document.getElementById("sideftr");
  const side=document.getElementById("side"), tab=document.getElementById("tabbar");
  if(!nav) return;
  if(IS_SITE && !session){
    nav.innerHTML=""; if(ftr) ftr.innerHTML="";
    if(side) side.style.display="none"; if(tab) tab.style.display="none"; return;
  }
  if(side) side.style.display="";
  if(tab) tab.style.display="";
  const key=navKey(r);
  nav.innerHTML=NAVITEMS.map(function(it){
    return '<a class="navi'+(key===it[0]?" on":"")+'" href="'+it[1]+'" title="'+it[2]+'">'+ICONS[it[0]]+'<span class="lbl-t">'+it[2]+'</span></a>';
  }).join("");
  if(tab) tab.innerHTML=NAVITEMS.map(function(it){
    return '<a class="'+(key===it[0]?"on":"")+'" href="'+it[1]+'">'+ICONS[it[0]]+'<span>'+it[2]+'</span></a>';
  }).join("");
  if(ftr){
    const em=(session&&session.user&&session.user.email)||"";
    const ini=(userName()||"Я").slice(0,2).toUpperCase();
    ftr.innerHTML=
      '<div class="prochip lbl-t"><b>PRO</b> · всё открыто<div style="margin-top:2px">спасибо, что строишь этот продукт</div></div>'+
      (em?'<div class="userrow"><span class="avatar">'+esc(ini)+'</span><span class="txt lbl-t">'+esc(em)+'</span></div>':'')+
      '<div class="lbl-t muted" style="font-size:10.5px;margin-bottom:2px">сборка '+BUILD+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="sidebtn" id="themeBtn" title="Тема">◐</button>'+
        '<button class="sidebtn" id="sideToggle" title="Свернуть меню">‹</button>'+
        (em?'<button class="sidebtn lbl-t" id="logoutBtn">Выйти</button>':'')+

  applyTheme();
}

function render(){
  const r=route();
  renderHeader(r);
  renderSidebar(r);
  if(IS_SITE && !session){ renderLanding(); return; }
  const app=document.getElementById("app");
  const draw=function(fn){ try{ return fn(); }catch(err){ console.error(err); return '<section class="panel"><h2>Не удалось отрисовать раздел</h2><p class="muted">'+esc(String(err&&err.message||err))+'</p><p class="muted" style="font-size:12.5px">Обнови страницу (Ctrl+F5). Если повторится — сообщи мне текст ошибки.</p></section>'; } };
  if (r.p==="goal") app.innerHTML=draw(function(){return vGoalPage(r.id);});
  else if (r.p==="money") app.innerHTML=draw(vMoney);
  else if (r.p==="tasks") app.innerHTML=draw(vTasksPage);
  else if (r.p==="goaledit") app.innerHTML=draw(vGoalEdit);
  else if (r.p==="weeks") app.innerHTML = state.goal?draw(vWeeks):'<section class="panel"><p class="muted">Сначала <a href="#/goal">создай главную цель</a> — недели считаются от её старта до дедлайна.</p></section>';
  else if (r.p==="dir"){ const d=dir(r.id); app.innerHTML = d?draw(function(){return vDir(d);}):'<p class="muted">Направление не найдено. <a href="#/">На главную</a></p>'; }
  else app.innerHTML=draw(vMain);
  const eb=document.querySelector("[data-exp-box]"); if(eb) updExplore(eb);
  applyTheme();
}

/* ---------- goal panels ---------- */
let expandedGoal=null;
const TIP_FACT="Деньги со статусом «получено» — они уже у тебя.";
const TIP_EXP="Факт + открытые сделки, умноженные на их вероятность. Реалистичная оценка того, к чему идёшь.";
const TIP_MAX="Если закроются все открытые сделки до единой. Оптимистичный потолок.";
function barCombo(gid, fact, target, size){
  const exp=fact+weightedGoal(gid), mx=fact+maxPotential(gid);
  const t=Math.max(1,target);
  const open=expandedGoal===gid;
  const done=fact>=t;
  const cls=(size||"")+(done?" done":"");
  const pf=Math.min(100,fact/t*100), pe=Math.min(100,exp/t*100), pm=Math.min(100,mx/t*100);
  return `
  <div class="cbar click ${cls}" data-expand="${gid}" title="Нажми, чтобы посмотреть вероятности">
    <div class="trk"></div>
    ${pe>pf?'<div class="exp" style="width:'+pe+'%" title="Ожидаемо: '+fmt(exp)+'"></div>':''}
    <div class="fct" style="width:${Math.max(pf,1.5)}%" title="Факт: ${fmt(fact)}"></div>
    ${mx>fact?'<div class="ntc" style="left:'+pm+'%" title="Максимум: '+fmt(mx)+'"><span>МАКС</span></div>':''}
  </div>
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
    <div class="barlegend">
      <span class="l1 tt" data-tip="${TIP_FACT}"><i></i>факт <b class="num">${fmt(fact)}</b></span>
      <span class="l2 tt" data-tip="${TIP_EXP}"><i></i>ожидаемо <b class="num">${fmt(exp)}</b></span>
      <span class="l3 tt" data-tip="${TIP_MAX}"><i></i>максимум <b class="num">${fmt(mx)}</b></span>
    </div>
    <span class="expandhint ${open?"open":""}" data-expand="${gid}"><span class="chev">▾</span> вероятность</span>
  </div>
  ${open?vExplore(gid,fact,t):""}`;
}
function vExplore(gid, fact, target){
  const deals=openDeals(gid);
  return `<div class="probpanel" data-exp-box="${gid}" data-fact="${fact}" data-target="${target}">
    ${deals.length?"":'<p class="muted" style="font-size:13px;margin:0 0 8px">Открытых сделок по этой цели пока нет — ползунок оживёт, когда добавишь сделки с вероятностью.</p>'}
    <div class="cap">Порог вероятности</div>
    <div class="cbar sm" style="margin:8px 0"><div class="trk"></div><div class="exp" data-exp-pot></div><div class="fct" style="width:${Math.max(1.5,Math.min(100,fact/target*100))}%"></div></div>
    <input type="range" min="1" max="100" value="50" step="5" class="exp-sl" style="width:100%;accent-color:var(--accent)">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mut);flex-wrap:wrap;gap:8px">
      <span>считать сделки с вероятностью <b class="num" data-exp-thr style="color:var(--ink)"></b></span>
      <span>итог при пороге <b class="num" data-exp-amt style="color:var(--ink)"></b></span>
    </div>
    <div class="explore" style="border:none;padding:0;margin-top:8px"><div class="deals" data-exp-deals></div></div>
  </div>`;
}
function updExplore(box){
  const gid=box.dataset.expBox, fact=+box.dataset.fact, target=+box.dataset.target;
  const thr=+box.querySelector(".exp-sl").value;
  const deals=openDeals(gid);
  const pot=fact+deals.filter(d=>(d.prob||0)>=thr).reduce((s,d)=>s+amtOf(d),0);
  box.querySelector("[data-exp-pot]").style.width=Math.min(100,pot/target*100)+"%";
  box.querySelector("[data-exp-thr]").textContent="≥ "+thr+"%";
  box.querySelector("[data-exp-amt]").textContent=fmt(pot);
  box.querySelector("[data-exp-deals]").innerHTML=deals.slice().sort((a,b)=>(b.prob||0)-(a.prob||0)).map(d=>
    '<span style="'+((d.prob||0)>=thr?'':'opacity:.35;text-decoration:line-through')+'">'+esc(d.title)+' <b class="num">'+fmt(amtOf(d))+'</b> · '+(d.prob||0)+'%</span>').join("");
}
function ringHtml(pct, emoji, small){
  const p=Math.max(0,Math.min(100,pct));
  return '<div class="ring'+(small?" sm":"")+'" style="background:conic-gradient(var(--accent) '+p+'%, var(--track) 0)"><span>'+(emoji||"🎯")+'</span></div>';
}
function vGoalArea(){
  const g=state.goal;
  if(!g) return '<section class="panel bigadd" id="addMainGoal"><div class="plus">+</div><div class="t">Добавить цель</div></section>';
  const paid=paidTotalGoal("main"), tgt=goalTargetMain();
  const pct=tgt?paid/tgt*100:0;
  const dl=daysLeft(), pace=dl?Math.max(0,tgt-paid)/Math.max(1,dl/7):0;
  let rem=paid;
  const subs=(g.subs||[]).map(s=>{
    const done=Math.max(0,Math.min(rem,+s.amount)); rem-=done;
    const full=done>=+s.amount;
    return `<div class="subgoal">
      <span>${s.emoji?esc(s.emoji)+" ":""}${esc(s.label)}</span>
      <span class="num muted" style="text-align:right">${fmt(done)} / ${fmt(s.amount)}</span>
      <div class="bar"><i class="${full?"done":""}" style="width:${Math.min(100,s.amount?done/s.amount*100:0)}%"></i></div>
    </div>`;
  }).join("");
  return `<section class="panel" style="padding:24px">
    <div class="goalrow">
      <div style="display:flex;gap:18px;align-items:center;min-width:0">
        ${ringHtml(pct, g.emoji)}
        <div style="min-width:0">
          <div class="cap">Главная цель${g.deadline?" · дедлайн "+g.deadline:""}</div>
          <h2 style="font-size:26px;margin:6px 0 4px"><a href="#/g/main" style="color:var(--ink)">${esc(g.title||"Моя цель")} ›</a></h2>
          <div class="muted" style="font-size:13.5px">собрано <b class="num" style="color:var(--ink)">${fmt(paid)}</b> из <span class="num">${fmt(tgt)}</span></div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="goal-big">${fmt(paid)}</div>
        <div class="num muted" style="font-size:15px">${pct.toFixed(0)}% пути</div>
      </div>
    </div>
    ${barCombo("main", paid, tgt)}
    <div class="goalmeta">
      <span>осталось <b class="num">${fmt(Math.max(0,tgt-paid))}</b></span>
      ${dl?'<span>дней до дедлайна <b class="num">'+dl+'</b></span><span>нужный темп <b class="num">'+fmt(pace)+'/нед</b></span>':''}
    </div>
    ${subs?'<div class="subgoals">'+subs+'</div>':''}
  </section>`;
}

/* ---------- pace & focus ---------- */
function paceStats(){
  let need=0;
  const add=(remain,deadline)=>{
    if(!deadline||remain<=0) return;
    const wl=Math.max(1,(new Date(deadline+"T23:59:59")-new Date())/6048e5);
    need+=remain/wl;
  };
  if(state.goal) add(goalTargetMain()-paidTotalGoal("main"), state.goal.deadline);
  for(const g of state.goals) add((+g.target||0)-paidTotalGoal(g.id), g.deadline);
  const now=new Date();
  const pace=state.income.filter(i=>i.status==="paid"&&inRange(i.date,addD(now,-28),addD(now,1)))
    .reduce((s,i)=>s+amtOf(i),0)/4;
  return { need, pace, wgt: weighted() };
}
function vPace(){
  const st=paceStats(), need=st.need, pace=st.pace, wgt=st.wgt;
  if(!need) return "";
  const cov=pace/need;
  const cls=cov>=1?"ok":cov>=0.6?"lag":"fail";
  const col=cls==="ok"?"var(--green)":cls==="lag"?"var(--yellow)":"var(--red)";
  const msg=cls==="ok"?"идёшь с запасом — так держать"
    :cls==="lag"?"темп проседает — добери "+fmt(need-pace)+"/нед"
    :"темп провален — нужен рывок или крупная сделка";
  return '<section class="panel">'+
    '<div class="cap" style="margin-bottom:10px">Светофор темпа</div>'+
    '<div class="tl '+cls+'"><span class="dot"></span>'+
      '<span>нужно <b class="num">'+fmt(need)+'</b>/нед — твой темп <b class="num" style="color:'+col+'">'+fmt(pace)+'</b></span></div>'+
    '<div class="tlmsg" style="color:'+col+'">'+msg+'</div>'+
    (wgt?'<div class="muted" style="font-size:12.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px">в пайплайне ждёт <b class="num" style="color:var(--ink)">'+fmt(wgt)+'</b></div>':'')+
  '</section>';
}
function focusTasks(){
  const dirMoney={};
  for(const i of state.income)
    if(["idea","talks","invoiced"].includes(i.status)&&i.dirId)
      dirMoney[i.dirId]=(dirMoney[i.dirId]||0)+amtOf(i)*(i.prob||0)/100;
  const maxDM=Math.max(1,...Object.values(dirMoney),1);
  const dlScore=t=>{ if(!t.due) return 0; const d=(new Date(t.due+"T12:00")-new Date())/864e5; return d<0?3:d<7?2:d<30?1:0; };
  return state.tasks.filter(t=>t.status!=="done")
    .map(t=>({t, m:dirMoney[t.dirId]||0, s:(t.urgent?1000:0)+t.prio*100+((dirMoney[t.dirId]||0)/maxDM)*80+dlScore(t)*40}))
    .sort((a,b)=>b.s-a.s).slice(0,3);
}
function vFocus(){
  const top=focusTasks();
  if(!top.length) return "";
  const rows=top.map(function(x){
    const t=x.t, m=x.m;
    return '<div class="frow">'+
      '<span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);flex:none"></span>'+
      '<span style="flex:1;min-width:120px">'+(t.urgent?"🔥 ":"")+
        '<a href="#/dir/'+t.dirId+'" style="color:var(--ink);font-weight:500">'+esc(t.title)+'</a>'+
        '<div class="muted" style="font-size:12px">'+esc((dir(t.dirId)||{}).name||"")+'</div></span>'+
      (m?'<span class="num" style="color:var(--green);font-weight:600;font-size:12.5px">≈'+fmt(m)+'</span>'
         :(t.due?'<span class="num muted" style="font-size:12px">до '+t.due+'</span>':''))+
    '</div>';
  }).join("");
  return '<section class="panel">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px">'+
      '<h2>Сфокусируйся сегодня</h2><span class="cap">топ-3</span></div>'+
    rows+'</section>';
}

  const tile=function(lbl,val,hint,frac,cls,href){

  };
  const tiles='<section class="tiles">'+
    tile("Неделя", fmt(wk), wmin?"норма "+fmt(wmin):"доход за неделю", wmin?wk/wmin:(wk?1:0), wmin?(wk>=wmin?"good":"bad"):"", "#/weeks")+
    tile("Месяц · "+mName, fmt(mo), "обязательные "+fmt(fx), mo/Math.max(1,fx), mo>=fx?"good":"", "#/money")+
    tile("Прогноз", fmt(wgtAll), "сделки × вероятность", Math.min(1,wgtAll/Math.max(1,tgt-paid)), "", "#/money")+
    tile("Расходы", fmt(fx+adhocMo), "разовые "+fmt(adhocMo), 1, "", "#/money")+
    tile("Свободно на цели", fmt(freeCash), "после обязательных и долгов", freeCash>0?1:0, freeCash>=0?"good":"bad", "#/money")+
  '</section>';
  const dirsHtml = state.directions.length
    ? '<section class="panel"><div class="phead"><h2>Направления</h2><span class="cap">'+state.directions.length+' источников</span></div>'+
      '<div class="dirs">'+state.directions.slice().sort(function(a,b){return b.prio-a.prio;}).map(cardDir).join("")+'</div>'+
      '<form class="addrow" id="dirForm"><input name="title" placeholder="Новое направление" required>'+

    : '<section class="panel"><h2>Направления</h2><p class="muted" style="margin:8px 0 0">Направление — источник дохода: клиент, продукт, канал. Внутри — проекты и задачи.</p>'+
      '<form class="addrow" id="dirForm"><input name="title" placeholder="Например: Фриланс-разработка" required>'+
      '<button class="primary" type="submit">Добавить направление</button></form></section>';
  if(!state.goal) return vGoalArea()+tiles+dirsHtml;
  return '<div class="grid2">'+
    '<div>'+vGoalArea()+tiles+dirsHtml+'</div>'+
    '<div>'+vPace()+vSecondGoal()+vFocus()+'</div>'+
  '</div>';
}

function vDebts(){

  const lumps=state.debts.filter(d=>d.type!=="bank")
    .map(d=>({id:d.id, rem:Math.max(0,(+d.total||0)-(d.payments||[]).reduce((s,p)=>s+ +p.amount,0))}))
    .filter(x=>x.rem>0).sort((a,b)=>a.rem-b.rem);
  const firstId=lumps.length?lumps[0].id:null;
  const sorted=state.debts.slice().sort((a,b)=>(a.id===firstId?-1:0)-(b.id===firstId?-1:0));
  return sorted.map(d=>{
    const snow=d.id===firstId?'<span class="pill st-invoiced" title="Метод снежного кома: сначала гасится наименьший остаток — быстрые победы держат мотивацию">гаси первым</span> ':'';
    if(d.type==="bank"){
      return `<div class="debt" data-id="${d.id}">

    const pct=Math.min(100,d.total?paid/d.total*100:0);
    return `<div class="debt" data-id="${d.id}">
      <div class="head"><b class="v">${snow}${esc(d.title)}</b>
        <span class="num v">${fmt(paid)} / ${fmt(d.total||0)} ${d.due?'· до '+d.due:''}</span>

      <div class="pays">
        ${(d.payments||[]).map(p=>`<div class="p" data-pid="${p.id}">
          <span class="num muted">${p.date||""}</span><b class="num v neg">−${fmt(p.amount)}</b>

        <input name="date" type="date" value="${today()}">
        <input name="amount" class="amt" type="number" min="0" placeholder="$" required>
        <input name="comment" placeholder="Комментарий">
        <button class="primary" type="submit">Платёж</button>
      </form>
    </div>`;
  }).join("");
}

/* ---------- weeks page ---------- */
function vWeeks(){
  const weeks=allWeeks(); const now=mondayOf(new Date()).getTime();
  const min=state.goal.weeklyMin;
  const sq=weeks.map(m=>{
    const a=m, b=addD(m,7);
    const inc=paidIn(a,b), out=adhocIn(a,b)+debtPayIn(a,b), net=inc-out;
    let cls="";
    if(m.getTime()>now) cls="future";
    else if(net<0) cls="negw";
    else if(inc>0){ const r=inc/min; cls = r>=3?"l4":r>=1.5?"l3":r>=1?"l2":"l1"; }
    if(m.getTime()===now) cls+=" now";
    if(selWeek===m.toISOString().slice(0,10)) cls+=" sel";
    return `<button class="wk ${cls}" data-wk="${m.toISOString().slice(0,10)}">
      <div class="d">${fmtD(a)}–${fmtD(addD(b,-1))}</div>
      <div class="n num">${inc||out?((net>=0?"+":"−")+"$"+Math.abs(Math.round(net)).toLocaleString("ru-RU")):"·"}</div>
    </button>`;
  }).join("");

  let detail='<p class="muted">Нажми на неделю, чтобы увидеть сводку.</p>';

    const a=new Date(selWeek+"T00:00"), b=addD(a,7);

    const pays=[]; for(const d of state.debts) for(const p of (d.payments||[])) if(inRange(p.date,a,b)) pays.push({...p,debt:d.title});
    const inc=incs.reduce((s,i)=>s+amtOf(i),0), out=exps.reduce((s,e)=>s+ +e.amount,0), dp=pays.reduce((s,p)=>s+ +p.amount,0);

      <div class="mrow" style="margin-bottom:10px">

        <div class="mcell"><div class="lbl">Расходы</div><div class="v2 num ${out?"neg":""}">−${fmt(out)}</div></div>
        <div class="mcell"><div class="lbl">Долги</div><div class="v2 num ${dp?"neg":""}">−${fmt(dp)}</div></div>
        <div class="mcell"><div class="lbl">Чистыми</div><div class="v2 num ${inc-out-dp>=0?"pos":"neg"}">${fmt(inc-out-dp)}</div></div>
      </div>
      ${incs.length?'<p><b>Доходы:</b> '+incs.map(i=>esc(i.title)+' <span class="num pos">+'+fmt(amtOf(i))+'</span> <span class="muted">('+esc(incLabel(i))+')</span>').join(" · ")+'</p>':''}
      ${exps.length?'<p><b>Расходы:</b> '+exps.map(e=>esc(e.title)+' <span class="num neg">−'+fmt(e.amount)+'</span>').join(" · ")+'</p>':''}
      ${pays.length?'<p><b>Платежи по долгам:</b> '+pays.map(p=>esc(p.debt)+' <span class="num neg">−'+fmt(p.amount)+'</span>').join(" · ")+'</p>':''}
      ${(!incs.length&&!exps.length&&!pays.length)?'<p class="muted">Записей нет.</p>':''}`;
  }

  const adj=state.adjustments.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return `
  <section class="panel">
    <h2>Доход / расход по неделям</h2>

      <span><i style="background:var(--panel2)"></i>пусто</span>
      <span><i style="background:var(--ok-soft)"></i>&lt; мин</span>
      <span><i style="background:color-mix(in srgb,var(--ok) 30%,var(--panel))"></i>≥ $${state.goal.weeklyMin}</span>
      <span><i style="background:color-mix(in srgb,var(--ok) 72%,var(--panel))"></i>отличная неделя</span>

      <span><i style="outline:2px solid var(--accent)"></i>текущая</span>
    </div>
  </section>
  <section class="panel" id="weekDetail">${detail}</section>
  <section class="panel">
    <h2>Корректировки по остатку</h2>
    <p class="muted" style="margin-top:0">Не сходится с реальностью? Запиши факт: сколько осталось на руках и почему, как думаешь, разошлось.</p>
    <div class="tscroll"><table>
      <thead><tr><th>Дата</th><th class="r">Остаток по факту</th><th>Комментарий</th><th></th></tr></thead>

    </table></div>
    <form class="addrow" id="adjForm">
      <input name="date" type="date" value="${today()}">

const PRIO_OPTS=[["3","высокий"],["2","средний"],["1","низкий"]];

function fireBtn(t){ return '<button class="x" data-fire title="Горящая задача" style="font-size:14px;padding:2px 4px;'+(t.urgent?'':'filter:grayscale(1);opacity:.4')+'">🔥</button>'; }

  return `<section class="panel">

function emptyTasks(dirId){
  const scope=dirId||"all";
  const total=state.tasks.filter(t=>!dirId||t.dirId===dirId).length;
  const filtered=getRange(scope).mode!=="all";
  if(total&&filtered) return '<p class="muted" style="margin:6px 0">Под фильтр периода не попало ни одной задачи (всего их '+total+'). '+
    '<button class="ghost" data-resetrange="'+scope+'" style="padding:4px 10px;font-size:12.5px">Показать все</button></p>';
  return '<p class="muted" style="margin:6px 0">Задач пока нет — добавь первую в форме ниже.</p>';
}
function taskOrderInit(){
  let mx=0; state.tasks.forEach(function(t){ if(typeof t.ord==="number") mx=Math.max(mx,t.ord); });
  state.tasks.forEach(function(t){ if(typeof t.ord!=="number") t.ord=++mx; });
}
function getSort(scope){
  try{ return localStorage.getItem("u30_sort_"+scope)||"manual"; }catch(e){ return "manual"; }
}
function setSort(scope,v){ try{ localStorage.setItem("u30_sort_"+scope,v); }catch(e){} }
const SORTS=[["manual","Мой порядок"],["az","Название А-Я"],["za","Название Я-А"],["dir","Направление / проект"],["prio","Приоритет"],["status","Статус"],["start","Дата начала"],["due","Дедлайн"],["money","Сумма"]];
function targetLabel(t){
  const d=dir(t.dirId), p=t.projId?proj(t.projId):null;
  return (d?d.name:"")+(p?" / "+p.name:"");
}
function tasksSorted(dirId){
  taskOrderInit();
  const scope=dirId||"all";
  const bounds=rangeBounds(getRange(scope));
  const list=state.tasks.filter(function(t){ return (!dirId||t.dirId===dirId) && (!bounds||taskInRange(t,bounds)); });
  const mode=getSort(scope);
  const byOrd=function(a,b){ return (a.ord||0)-(b.ord||0); };
  const cmp={
    manual: byOrd,
    az: function(a,b){ return a.title.localeCompare(b.title,"ru")||byOrd(a,b); },
    za: function(a,b){ return b.title.localeCompare(a.title,"ru")||byOrd(a,b); },
    dir: function(a,b){ return targetLabel(a).localeCompare(targetLabel(b),"ru")||byOrd(a,b); },
    prio: function(a,b){ return ((b.urgent?1:0)-(a.urgent?1:0))||(b.prio-a.prio)||byOrd(a,b); },
    status: function(a,b){ const o={todo:0,doing:1,done:2}; return (o[a.status]-o[b.status])||byOrd(a,b); },
    start: function(a,b){ return String(a.start||"9999").localeCompare(String(b.start||"9999"))||byOrd(a,b); },
    due: function(a,b){ return String(a.due||"9999").localeCompare(String(b.due||"9999"))||byOrd(a,b); },
    money: function(a,b){ return (+b.money||0)-(+a.money||0)||byOrd(a,b); }
  }[mode]||byOrd;
  return list.sort(cmp);
}
function sortUI(scope){
  const cur=getSort(scope);
  const label=(SORTS.find(function(s){ return s[0]===cur; })||SORTS[0])[1];
  return '<span style="display:inline-flex;align-items:center;gap:6px">'+
    '<span title="Сортировка списка" style="color:var(--mut)">⇅</span>'+
    '<select class="slim task-sort" data-scope="'+scope+'" title="Сортировка: '+label+'">'+
      SORTS.map(function(s){ return '<option value="'+s[0]+'"'+(cur===s[0]?" selected":"")+'>'+s[1]+'</option>'; }).join("")+
    '</select></span>';
}
function moneyTasks(){

    .sort(function(a,b){ return (a.status==="done")-(b.status==="done") || (+b.money||0)-(+a.money||0); });
}
function taskAmt(t){ return t.mcur==="RUB" ? (+t.money||0)/rubRate() : (+t.money||0); }

    (manual?'<p class="muted" style="font-size:12px;margin:8px 0 0">Строки можно перетаскивать мышью — порядок сохранится.</p>':'');

function vKanban(dirId){
  const ts=tasksSorted(dirId);
  return '<div class="kanban">'+TASK_COLS.map(([st,label],ci)=>{
    const items=ts.filter(t=>t.status===st);
    const cards=items.map(t=>`<div class="kcard p${t.prio}" draggable="true" data-id="${t.id}">
      <input class="inline ${st==="done"?"tdone":""}" data-f="title" value="${esc(t.title)}">

      ${+t.money?'<div class="num" style="color:var(--green);font-weight:600;font-size:12.5px;margin-top:4px">+'+fmt(taskAmt(t))+'</div>':''}

        ${ci>0?'<button class="mv" data-mv="-1" title="Назад">◀</button>':''}
        ${ci<2?'<button class="mv" data-mv="1" title="Вперёд">▶</button>':''}
        <button class="x" data-del="tasks">×</button></div></div>`).join("");
    const dotc = st==="todo"?"var(--mut)":st==="doing"?"var(--yellow)":"var(--green)";
    return '<div class="kcol" data-col="'+st+'"><h3><span style="width:8px;height:8px;border-radius:50%;background:'+dotc+';display:inline-block"></span>'+label+
      ' <span class="num muted" style="font-weight:400">'+items.length+'</span></h3>'+
      (cards||'<p class="muted" style="font-size:12.5px;margin-bottom:8px">перетащи сюда</p>')+'</div>';
  }).join("")+'</div>';

function vGantt(dirId){
  const ts=tasksSorted(dirId);
  if(!ts.length) return emptyTasks(dirId);
  const dated=ts.filter(t=>t.start&&t.due);
  const gb=rangeBounds(getRange(dirId||"all"));
  let min,max;
  if(gb){ min=mondayOf(gb[0]); max=addD(mondayOf(addD(gb[1],6)),0); if(max<=min) max=addD(min,7); }
  else if(dated.length){
    min=mondayOf(new Date(Math.min(...dated.map(t=>+new Date(t.start+"T12:00")))));
    max=addD(mondayOf(new Date(Math.max(...dated.map(t=>+new Date(t.due+"T12:00"))))),7);
  } else { min=mondayOf(new Date()); max=addD(min,28); }
  if((max-min)/6048e5<4) max=addD(min,28);
  const total=max-min, px=d=>((d-min)/total*100);
  let lines="",labels="";
  for(let d=new Date(min); d<=max; d=addD(d,7)){
    const x=px(d), isM=d.getDate()<=7;
    lines+='<i class="gline'+(isM?" month":"")+'" style="left:'+x+'%"></i>';
    labels+='<span style="left:'+x+'%">'+fmtD(d)+'</span>';
  }
  const now=new Date();
  const today=(now>=min&&now<=max)?'<i class="gtoday" style="left:'+px(now)+'%"></i>':'';
  const rows=ts.map(t=>{
    let bar='';
    if(t.start&&t.due){
      const s=new Date(t.start+"T12:00"), e=addD(new Date(t.due+"T12:00"),1);
      const l=Math.max(0,Math.min(99,px(s))), w=Math.max(1.2,Math.min(px(e),100)-l);
      bar='<div class="gbar2 p'+t.prio+(t.status==="done"?" done":"")+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(t.title)+'"></div>';
    }
    return `<div class="grow2" data-id="${t.id}">
      <div class="ttl"><span class="tname ${t.status==="done"?"tdone":""}">${t.urgent?"🔥 ":""}${esc(t.title)}${+t.money?' <span class="num" style="color:var(--green)">+'+fmt(taskAmt(t))+'</span>':''}</span>
        <div class="dts"><input class="num" data-f="start" type="date" value="${t.start||""}"><input class="num" data-f="due" type="date" value="${t.due||""}"></div></div>
      <div class="gtrackwrap"><div class="ggrid">${lines}${today}</div>${bar}</div></div>`;
  }).join("");
  return '<div class="gantt"><div class="gin"><div class="gaxis">'+labels+'</div>'+rows+'</div></div>';
}

function listOf(name){ return state[name]; }
function findItem(id){
  for (const k of ["income","goals","expensesFixed","expensesAdhoc","directions","projects","tasks","debts","adjustments"]){
    const it=state[k].find(x=>x.id===id); if(it) return it;
  }
  if (state.goal && Array.isArray(state.goal.subs)){
    const it=state.goal.subs.find(x=>x.id===id); if(it) return it;
  }
  return null;
}
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.classList.contains("exp-sl")){ const box=t.closest("[data-exp-box]"); if(box) updExplore(box); return; }
  if(t.classList.contains("goal-f")){
    state.goal[t.dataset.g] = t.type==="number" ? +t.value : t.value;
    touch(false); return;
  }
  if(!t.dataset.f) return;
  const holder=t.closest("[data-id]"); if(!holder) return;
  const item=findItem(holder.dataset.id); if(!item) return;
  item[t.dataset.f] = t.type==="number" ? +t.value : t.value;
  touch(false); // без перерисовки — фокус остаётся в поле
});
document.addEventListener("change", e=>{
  const t=e.target, holder=t.closest("[data-id]");
  const cl=t.classList;
  if(cl.contains("goal-f")){ touch(true); return; }
  if(cl.contains("inc-st")&&holder){
    const i=state.income.find(x=>x.id===holder.dataset.id);
    i.status=t.value;
    if(t.value==="paid"){ i.prob=100; if(!i.date) i.date=today(); }
    touch(true); return;
  }
  if(cl.contains("inc-target")&&holder){ applyTarget(state.income.find(x=>x.id===holder.dataset.id), t.value); touch(true); return; }
  if(cl.contains("inc-goal")&&holder){ state.income.find(x=>x.id===holder.dataset.id).goalId=t.value; touch(true); return; }
  if(cl.contains("inc-cur")&&holder){ state.income.find(x=>x.id===holder.dataset.id).cur=t.value; touch(true); return; }
  if(cl.contains("set-rate")){ state.settings.rubRate=Math.max(1,+t.value||100); touch(true); return; }
  if(cl.contains("task-range")){ const r=getRange(t.dataset.scope); r.mode=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("range-from")){ const r=getRange(t.dataset.scope); r.from=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("range-to")){ const r=getRange(t.dataset.scope); r.to=t.value; saveRange(t.dataset.scope); render(); return; }
  if(cl.contains("dir-prio")){ dir(t.dataset.dir).prio=+t.value; touch(true); return; }
  if(cl.contains("dir-st")){ dir(t.dataset.dir).status=t.value; touch(true); return; }
  if(cl.contains("proj-st")&&holder){ proj(holder.dataset.id).status=t.value; touch(true); return; }
  if(cl.contains("pj-prio")&&holder){ proj(holder.dataset.id).prio=+t.value; touch(true); return; }
  if(cl.contains("task-target")&&holder){ applyTarget(state.tasks.find(function(x){return x.id===holder.dataset.id;}), t.value); touch(true); return; }
  if(cl.contains("task-mcur")&&holder){ state.tasks.find(function(x){return x.id===holder.dataset.id;}).mcur=t.value; touch(true); return; }
  if(cl.contains("task-sort")){ setSort(t.dataset.scope, t.value); render(); return; }
  if(cl.contains("task-prio")&&holder){ state.tasks.find(x=>x.id===holder.dataset.id).prio=+t.value; touch(true); return; }
  if(cl.contains("task-st")&&holder){ state.tasks.find(x=>x.id===holder.dataset.id).status=t.value; touch(true); return; }
  if(t.dataset.f==="prob"&&holder){
    /* «получено» = факт на 100%. Поставил вероятность < 100 — запись возвращается в «счёт» и считается прогнозом */
    const inc=state.income.find(x=>x.id===holder.dataset.id);
    if(inc && inc.status==="paid" && +t.value<100) inc.status="invoiced";
    touch(true); return;
  }
  if(t.dataset.f){ touch(true); return; } // blur после inline-правки — перерисовать производные
});

  if(f.id==="incForm"){
    const st=fd.get("status")||"idea";
    const it={ id:uid(), title:fd.get("title"), amount:+fd.get("amount"), cur:fd.get("cur")||"USD", prob:st==="paid"?100:(+fd.get("prob")||0), status:st, date:fd.get("date")||(st==="paid"?today():""), dirId:"", projId:null, goalId:fd.get("goal")||"main" };
    applyTarget(it, fd.get("target"));
    state.income.push(it);
  }
  else if(f.id==="expForm") state.expensesFixed.push({ id:uid(), title:fd.get("title"), amount:+fd.get("amount") });
  else if(f.id==="adhocForm") state.expensesAdhoc.push({ id:uid(), date:fd.get("date")||today(), title:fd.get("title"), amount:+fd.get("amount"), comment:fd.get("comment")||"" });
  else if(f.id==="debtForm"){
    const type=fd.get("type"), amt=+fd.get("amount");
    state.debts.push(type==="bank"
      ? { id:uid(), title:fd.get("title"), type:"bank", monthly:amt, payments:[] }
      : { id:uid(), title:fd.get("title"), type:"lump", total:amt, due:fd.get("due")||"", payments:[] });
  }
  else if(f.id==="dirForm") state.directions.push({ id:uid(), name:fd.get("title"), prio:2, status:"active" });
  else if(f.id==="projForm") state.projects.push({ id:uid(), dirId:f.dataset.dir, name:fd.get("title"), status:"active", prio:2 });
  else if(f.classList.contains("taskForm")){
    let dirId=f.dataset.dir||"", projId=null;
    if(dirId) projId=fd.get("proj")||null;
    else { const tg=fd.get("target")||"";
      if(tg.startsWith("p:")){ const p=proj(tg.slice(2)); projId=p.id; dirId=p.dirId; }
      else if(tg.startsWith("d:")) dirId=tg.slice(2); }
    taskOrderInit();
    const maxOrd=state.tasks.reduce(function(m2,t2){ return Math.max(m2,t2.ord||0); },0);
    state.tasks.push({ id:uid(), dirId:dirId, projId:projId, title:fd.get("title"), prio:+fd.get("prio"), status:"todo", start:fd.get("start")||"", due:fd.get("due")||"", urgent:false, money:+fd.get("money")||0, mcur:"USD", ord:maxOrd+1 });
  }
  else if(f.id==="adjForm") state.adjustments.push({ id:uid(), date:fd.get("date")||today(), balance:+fd.get("balance"), comment:fd.get("comment")||"" });
  else if(f.id==="goalForm") state.goals.push({ id:uid(), name:fd.get("title"), target:+fd.get("amount"), deadline:fd.get("due")||"" });
  else if(f.id==="subForm"){ if(!state.goal.subs) state.goal.subs=[]; state.goal.subs.push({ id:uid(), label:fd.get("title"), amount:+fd.get("amount") }); }
  else if(f.classList.contains("payForm")){
    const debt=state.debts.find(x=>x.id===f.dataset.debt);
    debt.payments.push({ id:uid(), date:fd.get("date")||today(), amount:+fd.get("amount"), comment:fd.get("comment")||"" });
  }
  else return;
  f.reset&&f.reset();
  touch(true);
});
window.addEventListener("hashchange", render);

/* drag-and-drop строк списка задач */
let dragRowId=null;
document.addEventListener("dragstart", function(e){
  const tr=e.target.closest&&e.target.closest("tr.trow");
  if(tr){ dragRowId=tr.dataset.id; tr.style.opacity=".45"; e.dataTransfer.effectAllowed="move"; }
});
document.addEventListener("dragend", function(e){
  const tr=e.target.closest&&e.target.closest("tr.trow");
  if(tr) tr.style.opacity="";
});
document.addEventListener("dragover", function(e){
  if(!dragRowId) return;
  const tr=e.target.closest&&e.target.closest("tr.trow");
  if(tr) e.preventDefault();
});
document.addEventListener("drop", function(e){
  if(!dragRowId) return;
  const tr=e.target.closest&&e.target.closest("tr.trow");
  if(!tr) return;
  e.preventDefault();
  const overId=tr.dataset.id;
  if(overId===dragRowId){ dragRowId=null; return; }
  taskOrderInit();
  const ids=Array.prototype.slice.call(tr.closest("tbody").querySelectorAll("tr.trow")).map(function(x){ return x.dataset.id; });
  const from=ids.indexOf(dragRowId), to=ids.indexOf(overId);
  ids.splice(to,0,ids.splice(from,1)[0]);
  ids.forEach(function(id,i){ const t=state.tasks.find(function(x){return x.id===id;}); if(t) t.ord=i+1; });
  dragRowId=null;
  touch(true);
});

/* drag-and-drop канбана */
let dragTaskId=null;
document.addEventListener("dragstart", e=>{
  const c=e.target.closest&&e.target.closest(".kcard");
  if(c){ dragTaskId=c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",c.dataset.id);}catch(x){} }
});
document.addEventListener("dragend", e=>{
  const c=e.target.closest&&e.target.closest(".kcard");
  if(c) c.classList.remove("dragging");
  document.querySelectorAll(".kcol.dropover").forEach(k=>k.classList.remove("dropover"));
});
document.addEventListener("dragover", e=>{
  const col=e.target.closest&&e.target.closest(".kcol");
  if(col&&dragTaskId){ e.preventDefault(); e.dataTransfer.dropEffect="move"; col.classList.add("dropover"); }
});
document.addEventListener("dragleave", e=>{
  const col=e.target.closest&&e.target.closest(".kcol");
  if(col) col.classList.remove("dropover");
});
document.addEventListener("drop", e=>{
  const col=e.target.closest&&e.target.closest(".kcol");
  if(col&&dragTaskId){
    e.preventDefault();
    const task=state.tasks.find(x=>x.id===dragTaskId);
    if(task && task.status!==col.dataset.col){ task.status=col.dataset.col; touch(true); }
    else document.querySelectorAll(".kcol.dropover").forEach(k=>k.classList.remove("dropover"));
    dragTaskId=null;
  }
});

/* ================= saving ================= */
function chip(cls,text){ const c=document.getElementById("savechip"); c.className="savechip "+cls; c.textContent=text; }
function touch(rerender){
  state.updated=Date.now(); dirty=true;
  try{ localStorage.setItem(lsKey(), JSON.stringify(state)); }catch(e){}
  chip("dirty","Есть изменения…");
  if(rerender) render();
  clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave, 2500);
}
async function cloudSave(){
  if(!dirty) return;
  if(!artifactNS && authMode && session){
    chip("saving","Сохраняю…");
    try{ await accountPush(); dirty=false; chip("","✓ "+(session.user.email||"аккаунт")); }
    catch(e){ chip("local","Сохранено локально (нет сети?)"); dirty=false; }
    return;
  }
  if(!artifactNS && supaMode){
    chip("saving","Сохраняю…");
    try{ await supaPush(); dirty=false; chip("","В облаке ✓"); }
    catch(e){ chip("local","Сохранено локально (нет сети?)"); dirty=false; }
    return;
  }
  if(!artifactNS){ chip("local","Сохранено локально"); dirty=false; return; }
  chip("saving","Сохраняю…");
  const json=JSON.stringify(state).replace(/</g,"\\u003c");
  try{
    await artifactNS.publish({ "data/state.json": { content: json, contentType:"application/json" } });
    dirty=false; chip("","Сохранено ✓");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict"){ return; }
    if(code==="capability_disabled"||code==="read_only_path"){
      try{
        const src=await (await fetch("index.html")).text();
        const html=src.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,"$1"+json+"$2");
        await artifactNS.publish(html.startsWith("<!doctype")?html:"<!doctype html>\n"+html);
        dirty=false; return;
      }catch(e2){ chip("local","Сохранено локально"); dirty=false; return; }
    }
    if(code==="not_writer"||code==="not_granted"){ artifactNS=null; chip("local","Сохранено локально"); dirty=false; return; }
    chip("local","Сохранено локально"); dirty=false;
  }
}
window.addEventListener("beforeunload",()=>{ try{ localStorage.setItem(lsKey(), JSON.stringify(state)); }catch(e){} });

/* ---------- Supabase sync (версия-сайт) ---------- */
function getSyncKey(){
  const m = location.search.match(/[?&]k=([A-Za-z0-9_-]{24,})/);
  if (m){ try{ localStorage.setItem("u30_key", m[1]); }catch(e){} return m[1]; }
  let k = null;
  try{ k = localStorage.getItem("u30_key"); }catch(e){}
  if (!k){
    const a = new Uint8Array(24); crypto.getRandomValues(a);
    k = Array.from(a, b=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"[b&63]).join("");
    try{ localStorage.setItem("u30_key", k); }catch(e){}
  }
  return k;
}
async function supaRpc(fn, body){
  const r = await fetch(SUPA.url+"/rest/v1/rpc/"+fn, {
    method:"POST",
    headers:{ "apikey":SUPA.key, "Authorization":"Bearer "+SUPA.key, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("supabase "+r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function supaLoadMerge(){
  const remote = migrate(await supaRpc("goals_get", { p_k: supaKey }));
  if (remote && (remote.updated||0) > (state.updated||0)){ state = remote; render(); }
  else if (remote===null || (state.updated||0) > (remote?.updated||0)){ await supaPush(); }
}
async function supaPush(){
  await supaRpc("goals_set", { p_k: supaKey, p_data: state, p_updated: state.updated||0 });
}
function syncUrl(){ return location.origin + location.pathname + "?k=" + supaKey; }

/* ---------- Аккаунт (Supabase Auth: Google / почта) ---------- */
function loadSbLib(){
  return new Promise((res,rej)=>{
    if(window.supabase&&window.supabase.createClient) return res();
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("cdn"));
    document.head.appendChild(s);
  });
}
function blankState(){
  const s=clone(DEFAULT_STATE);
  ["directions","projects","tasks","income","goals","expensesFixed","expensesAdhoc","debts","adjustments"].forEach(k=>s[k]=[]);
  if(!s.settings) s.settings={ rubRate:100 };
  s.goal=null; /* у нового аккаунта цели нет — большой «+ Добавить цель» */
  s.updated=Date.now();
  return s;
}
const IS_SITE = !(window.claude && typeof window.claude.use==="function");
function lsKey(){ return (authMode&&session)?LS_KEY+"_"+session.user.id:LS_KEY; }
async function accountFetch(){
  const {data,error}=await sb.from("user_dashboards").select("data").eq("user_id",session.user.id).maybeSingle();
  if(error) throw error;
  return data?migrate(data.data):null;
}
async function accountPush(){
  const {error}=await sb.from("user_dashboards").upsert({ user_id:session.user.id, data:state, updated:state.updated||0, updated_at:new Date().toISOString() });
  if(error) throw error;
}
async function accountLoad(){
  /* данные аккаунта — только из строки аккаунта (+ его личный офлайн-кэш). Никаких переносов чужого. */
  const remote=await accountFetch();
  let cache=null;
  try{ cache=migrate(JSON.parse(localStorage.getItem(LS_KEY+"_"+session.user.id))); }catch(e){}
  state = newest(remote, cache) || blankState();
  render();
  await accountPush();
}
function renderAuth(){
  const el=document.getElementById("authbox");
  if(!el||!sb||artifactNS||!session){ if(el) el.innerHTML=""; return; }
  el.innerHTML = "";
}
async function onAuthChanged(){
  renderAuth();
  if(session){
    chip("saving","Подключаю аккаунт…");
    try{ authMode=true; supaMode=false; await accountLoad(); chip("","✓ "+(session.user.email||"аккаунт")); }
    catch(e){ authMode=false; chip("local","Аккаунт: ошибка сети — обнови страницу"); }
  } else {
    /* вышел из аккаунта: чистим общий кэш и стартуем заново, чтобы данные аккаунта не остались на странице */
    authMode=false;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    location.reload();
  }
}
document.addEventListener("click", async e=>{
  if((e.target.id==="googleBtn"||e.target.id==="googleBtn2")&&sb){
    await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin+location.pathname } });
  }
  if(e.target.id==="emailBtn"&&sb){
    const email=prompt("Твоя почта — пришлём ссылку для входа:");
    if(!email) return;
    const {error}=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+location.pathname } });
    alert(error?("Не получилось: "+error.message):"Ссылка отправлена на "+email+". Открой письмо и перейди по ней.");
  }
  if(e.target.id==="logoutBtn"&&sb){ await sb.auth.signOut(); }
});

/* ================= theme ================= */
function applyTheme(){
  let t="auto"; try{ t=localStorage.getItem("u30_theme")||"auto"; }catch(e){}
  const r=document.documentElement;
  if(t==="auto") delete r.dataset.theme; else r.dataset.theme=t;
  const b=document.getElementById("themeBtn");
  if(b){ b.textContent = t==="light"?"☀️":t==="dark"?"🌙":"◐"; b.title="Тема: "+(t==="light"?"светлая":t==="dark"?"тёмная":"как в системе")+" (клик — переключить)"; }
  const seg=document.getElementById("themeSeg");
  if(seg) seg.innerHTML=[["auto","Авто"],["light","Светлая"],["dark","Тёмная"]].map(function(x){
    return '<button data-t="'+x[0]+'"'+(t===x[0]?' class="on"':'')+'>'+x[1]+'</button>'; }).join("");
  const ac=document.getElementById("acctLine");
  if(ac) ac.textContent = (session&&session.user&&session.user.email)?("Вы вошли как "+session.user.email+". Данные хранятся только в вашем аккаунте."):"Вход не выполнен.";
  const sdt=document.getElementById("sideToggle");
  if(sdt) sdt.textContent = localStorage.getItem("u30_side")==="1"?"›":"‹";
}
applyTheme();

/* ================= boot ================= */
document.getElementById("savechip").addEventListener("click", async ()=>{
  if(!supaMode || artifactNS) return;
  try{ await navigator.clipboard.writeText(syncUrl()); chip("","Ссылка синхронизации скопирована"); }
  catch(e){ prompt("Ссылка для других устройств:", syncUrl()); }
  setTimeout(()=>chip("","В облаке ✓ · клик = ссылка"), 2500);
});
(async function(){
  if(!IS_SITE){
    /* артефакт: личная версия владельца; темой управляет оболочка Claude */
    const tb=document.getElementById("themeBtn"); if(tb) tb.style.display="none";
    await loadState();
    render();
    chip("local","Локально");
    const ns=await window.claude.use("artifact");
    if(ns){ artifactNS=ns; chip("","Синхронизация ✓"); if(dirty) cloudSave(); }
    else chip("local","Только локально (этот браузер)");
    return;
  }
  /* сайт: гость видит лендинг; дашборд и данные — только в аккаунте */
  state = blankState();
  render();
  if(!SUPA.key) return;
  try{
    await loadSbLib();
    sb = window.supabase.createClient(SUPA.url, SUPA.key);
    const r = await sb.auth.getSession();
    session = r.data.session;
    sb.auth.onAuthStateChange((_ev,s2)=>{
      const was=session&&session.user.id, now=s2&&s2.user.id;
      session=s2;
      if(was!==now) onAuthChanged();
    });
  }catch(e){ sb=null; }
  renderAuth();
  if(sb&&session) await onAuthChanged();
})();
</script>
